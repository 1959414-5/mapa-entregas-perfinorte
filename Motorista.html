<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Minhas Entregas — Perfinorte</title>
<style>
  :root{
    --azul:#2f93a3;
    --amber:#e8a23d;
    --verde:#2f9e52;
    --vermelho:#d8622f;
    --bg:#f5f6f8;
    --texto:#1f2430;
    --dim:#6b7280;
    --linha:#e2e5e9;
    --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--texto); font-family:var(--font); -webkit-tap-highlight-color:transparent;}

  header{
    background:#12161b; color:#fff; padding:16px 18px;
    position:sticky; top:0; z-index:10;
  }
  header .eyebrow{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#9aa4b0;}
  header h1{margin:3px 0 0; font-size:19px; font-weight:700;}
  header .sub{margin-top:6px; font-size:12.5px; color:#c7ccd3; display:flex; gap:10px; align-items:center;}
  header .sub button{
    background:none; border:1px solid #3a4250; color:#c7ccd3;
    padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer;
  }
  .tag-localizacao{
    font-size:10.5px; color:var(--verde); display:flex; align-items:center; gap:4px;
  }

  #tela-selecao{padding:24px 18px; max-width:420px; margin:0 auto;}
  #tela-selecao h2{font-size:16px; margin-bottom:14px;}
  #tela-selecao label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 5px;}
  #tela-selecao select, #tela-selecao input{
    width:100%; padding:12px; border-radius:8px; border:1px solid var(--linha);
    background:#fff; font-size:16px; color:var(--texto);
  }
  #tela-selecao button{
    margin-top:20px; width:100%; padding:14px; border:none; border-radius:8px;
    background:var(--azul); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }

  #lista{padding:14px; max-width:560px; margin:0 auto; display:none;}
  .btn-atualizar{
    display:block; width:100%; margin-bottom:12px; padding:12px;
    border:none; border-radius:10px; background:var(--azul); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-atualizar:disabled{opacity:.6;}

  .resumo{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .resumo .card{
    flex:1; background:#fff; border:1px solid var(--linha); border-radius:10px;
    padding:12px; text-align:center;
  }
  .resumo .card .n{font-size:22px; font-weight:700;}
  .resumo .card .l{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-top:2px;}

  .entrega{
    background:#fff; border:1px solid var(--linha); border-radius:12px;
    padding:16px; margin-bottom:12px;
  }
  .entrega.marcada-entregue{border-color:var(--verde); background:#f2fbf5;}
  .entrega.marcada-nao{border-color:var(--vermelho); background:#fdf3ef;}
  .entrega .topo{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .entrega .cliente{font-size:16px; font-weight:700;}
  .entrega .periodo{
    font-size:10.5px; padding:3px 8px; border-radius:20px; white-space:nowrap;
    font-weight:700; letter-spacing:.03em;
  }
  .entrega .periodo.MANHÃ{background:rgba(232,162,61,.18); color:#8a5c14;}
  .entrega .periodo.TARDE{background:rgba(47,147,163,.18); color:#175661;}
  .entrega .endereco{margin-top:6px; font-size:13.5px; color:var(--dim); line-height:1.4;}
  .entrega .acoes{display:flex; gap:8px; margin-top:14px;}
  .entrega .acoes a{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    width:46px; border-radius:8px; border:1px solid var(--linha); background:#fff;
    color:var(--texto); text-decoration:none; font-size:18px;
  }
  .entrega .acoes button{
    flex:1; padding:13px 8px; border-radius:8px; border:1px solid var(--linha);
    background:#fff; font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .entrega .acoes button.entregue-btn.ativo{background:var(--verde); border-color:var(--verde); color:#fff;}
  .entrega .acoes button.nao-btn.ativo{background:var(--vermelho); border-color:var(--vermelho); color:#fff;}
  .entrega .marcado-em{margin-top:8px; font-size:11px; color:var(--dim);}
  .entrega .ja-marcado-banner{
    margin-top:8px; padding:8px 10px; border-radius:6px;
    background:rgba(47,158,82,.12); color:var(--verde);
    font-size:12.5px; font-weight:700;
  }

  .vazio{text-align:center; padding:60px 20px; color:var(--dim);}
  .vazio .big{font-size:34px; margin-bottom:10px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translate(-50%,20px);
    background:#12161b; color:#fff; padding:11px 20px; border-radius:8px;
    font-size:13.5px; opacity:0; transition:all .2s ease; pointer-events:none; z-index:999;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .toast.erro{background:var(--vermelho);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Perfinorte · Expedição</div>
  <h1>Minhas Entregas</h1>
  <div class="sub" id="headerSub" style="display:none;">
    <span id="headerInfo"></span>
    <span class="tag-localizacao">📍 compartilhando localização</span>
    <button onclick="trocarMotorista()">Trocar</button>
  </div>
</header>

<div id="tela-selecao">
  <h2>Quem é você?</h2>
  <label for="selMotorista">Motorista</label>
  <select id="selMotorista">
    <option value="">Carregando...</option>
  </select>
  <label for="selData">Data</label>
  <input type="date" id="selData">
  <button onclick="iniciarSessao()">Ver minhas entregas</button>
</div>

<div id="lista">
  <button id="btnAtualizar" class="btn-atualizar" onclick="atualizarManual_()">🔄 Atualizar entregas</button>
  <div class="resumo">
    <div class="card"><div class="n" id="totCount">–</div><div class="l">Entregas</div></div>
    <div class="card"><div class="n" id="totFeitas">–</div><div class="l">Marcadas</div></div>
  </div>
  <div id="cards"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =====================================================================
 * COLE AQUI A MESMA URL DO /exec usada no Mapa.html.
 * ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxq2r5WwP_DxFUpO7jV7XthtIGbTLlie8Od799ehwYANEabahf5TitwIt9RqVhXyft6/exec";

let entregas = [];
let marcacoes = {}; // linha -> 'ENTREGUE' | 'NAO_ENTREGUE' (o que já foi marcado nesta sessão)

async function chamarAPI_GET_(params){
  // "_t" no final força o navegador a nunca reaproveitar uma resposta em
  // cache — sem isso, às vezes ele mostra dados antigos mesmo já tendo
  // mudado na planilha de verdade.
  const comCacheBusting = Object.assign({}, params, { _t: Date.now() });
  const qs = new URLSearchParams(comCacheBusting).toString();
  const resp = await fetch(API_URL + '?' + qs, { cache: 'no-store' });
  return await resp.json();
}
async function chamarAPI_POST_(corpo){
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo)
  });
  return await resp.json();
}

function mostrarToast(msg, erro){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (erro ? ' erro' : '');
  setTimeout(() => { t.className = 'toast'; }, 2800);
}

async function carregarMotoristasSelecao(){
  const sel = document.getElementById('selMotorista');
  if (!API_URL){
    sel.innerHTML = '<option value="">Configure a API_URL no arquivo</option>';
    return;
  }
  try{
    const lista = await chamarAPI_GET_({ formato: 'motoristas' });
    sel.innerHTML = '<option value="">Selecione...</option>' +
      lista.map(m => `<option value="${m}">${m}</option>`).join('');
    const salvo = localStorage.getItem('motoristaAtual');
    if (salvo) sel.value = salvo;
  }catch(err){
    sel.innerHTML = '<option value="">Erro ao carregar</option>';
  }
}

function trocarMotorista(){
  document.getElementById('lista').style.display = 'none';
  document.getElementById('tela-selecao').style.display = 'block';
  document.getElementById('headerSub').style.display = 'none';
}

async function iniciarSessao(){
  const motorista = document.getElementById('selMotorista').value;
  const data = document.getElementById('selData').value;
  if (!motorista){
    mostrarToast('Selecione seu nome.', true);
    return;
  }
  localStorage.setItem('motoristaAtual', motorista);
  localStorage.setItem('dataAtual', data);

  document.getElementById('tela-selecao').style.display = 'none';
  document.getElementById('lista').style.display = 'block';
  document.getElementById('headerSub').style.display = 'flex';
  document.getElementById('headerInfo').textContent = motorista + ' · ' + formatarDataBR_(data);

  await carregarEntregasDoMotorista();
  iniciarRastreamento_();
}

/* ===== LOCALIZAÇÃO EM TEMPO REAL =====
   Manda a posição do GPS pra Viviane conseguir acompanhar no mapa. Só
   funciona com a permissão do motorista (o navegador pede sozinho na
   primeira vez) e só enquanto essa página estiver aberta. */
let watchIdLocalizacao = null;
let ultimoEnvioLocalizacao = 0;

function iniciarRastreamento_(){
  if (!navigator.geolocation || watchIdLocalizacao !== null) return;

  watchIdLocalizacao = navigator.geolocation.watchPosition(
    (pos) => { enviarLocalizacao_(pos.coords.latitude, pos.coords.longitude); },
    (err) => { console.error('Erro de localização:', err.message); },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
  );
}

async function enviarLocalizacao_(lat, lng){
  const agora = Date.now();
  if (agora - ultimoEnvioLocalizacao < 45000) return; // no máximo a cada 45s, pra não gastar bateria/dados à toa
  ultimoEnvioLocalizacao = agora;

  const motorista = localStorage.getItem('motoristaAtual');
  if (!motorista) return;
  try{
    await chamarAPI_POST_({ acao: 'atualizarLocalizacao', motorista: motorista, lat: lat, lng: lng });
  }catch(err){
    // silencioso — não vale a pena incomodar o motorista com erro de GPS
  }
}

function formatarDataBR_(iso){
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}

async function carregarEntregasDoMotorista(mostrarCarregando){
  const motorista = localStorage.getItem('motoristaAtual');
  const data = localStorage.getItem('dataAtual');
  const container = document.getElementById('cards');
  if (mostrarCarregando !== false){
    container.innerHTML = '<div class="vazio"><div class="big">⏳</div>Carregando…</div>';
  }

  try{
    // filtra já no servidor (só pede as entregas desse motorista/data) —
    // bem mais rápido que baixar as de todo mundo e filtrar aqui
    const params = { formato: 'dados', motorista: motorista };
    if (data) params.data = data;

    const [filtradas, pendentes] = await Promise.all([
      chamarAPI_GET_(params),
      chamarAPI_GET_({ formato: 'confirmacoesPendentes' })
    ]);

    const todasBrutas = Array.isArray(filtradas) ? filtradas : [];
    const pendentesLista = Array.isArray(pendentes) ? pendentes : [];

    // reconstrói o que ele já marcou (mesmo se foi em outra sessão/aparelho,
    // não depende só da memória do navegador)
    marcacoes = {};
    pendentesLista.forEach(p => {
      if (String(p.motorista || '').toUpperCase() === motorista.toUpperCase()){
        marcacoes[p.linha] = p.statusMarcado;
      }
    });

    // regra de visibilidade:
    //  - status já ENTREGUE (confirmado pela Viviane) -> some da lista
    //  - ele já marcou como ENTREGUE (ainda pendente) -> mostra só informativo
    //  - "OK" marcado (pedido pronto) e ainda não entregue -> mostra pra ele agir
    entregas = todasBrutas.filter(d => {
      if (String(d.status || '').toUpperCase() === 'ENTREGUE') return false;
      if (marcacoes[d.linha] === 'ENTREGUE') return true;
      return d.ok === true;
    });

    renderCards();
  }catch(err){
    container.innerHTML = '<div class="vazio"><div class="big">⚠</div>Não foi possível carregar.</div>';
  }
}

async function atualizarManual_(){
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = '🔄 Atualizando…';
  await carregarEntregasDoMotorista(false); // mantém os cards visíveis, sem tela de carregando
  btn.disabled = false;
  btn.textContent = textoOriginal;
  mostrarToast('Atualizado!');
}

function renderCards(){
  const container = document.getElementById('cards');
  document.getElementById('totCount').textContent = entregas.length;
  document.getElementById('totFeitas').textContent = Object.keys(marcacoes).length;

  if (!entregas.length){
    container.innerHTML = '<div class="vazio"><div class="big">📭</div>Nenhuma entrega pendente pra você nessa data.</div>';
    return;
  }

  container.innerHTML = entregas.map(d => {
    const marcado = marcacoes[d.linha];
    const jaEntregue = marcado === 'ENTREGUE';
    const classeCard = jaEntregue ? 'marcada-entregue' : (marcado === 'NAO_ENTREGUE' ? 'marcada-nao' : '');
    const linkMapa = (d.lat != null && d.lng != null)
      ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&travelmode=driving" target="_blank" title="Traçar rota até aqui">🧭</a>`
      : '';

    const acoes = jaEntregue
      ? `<div class="acoes">${linkMapa}</div>
         <div class="ja-marcado-banner">✅ Você já marcou como entregue — aguardando confirmação da Viviane</div>`
      : `<div class="acoes">
          ${linkMapa}
          <button class="entregue-btn ${marcado === 'ENTREGUE' ? 'ativo' : ''}" onclick="marcar(${d.linha}, 'ENTREGUE', this)">✅ Entregue</button>
          <button class="nao-btn ${marcado === 'NAO_ENTREGUE' ? 'ativo' : ''}" onclick="marcar(${d.linha}, 'NAO_ENTREGUE', this)">❌ Não entregue</button>
        </div>
        ${marcado === 'NAO_ENTREGUE' ? '<div class="marcado-em">Marcado como não entregue — aguardando revisão da Viviane</div>' : ''}`;

    return `
      <div class="entrega ${classeCard}" data-linha="${d.linha}">
        <div class="topo">
          <div class="cliente">${d.cliente}</div>
          <div class="periodo ${d.periodo === 'TARDE' ? 'TARDE' : 'MANHÃ'}">${d.periodo || '—'}</div>
        </div>
        <div class="endereco">${d.endereco}</div>
        ${d.observacoes ? '<div class="endereco">📝 ' + d.observacoes + '</div>' : ''}
        ${acoes}
      </div>`;
  }).join('');
}

async function marcar(linha, status, botao){
  const motorista = localStorage.getItem('motoristaAtual');
  const card = botao.closest('.entrega');
  botao.disabled = true;

  try{
    const res = await chamarAPI_POST_({ acao: 'marcarEntregaMotorista', linha: linha, status: status, motorista: motorista });
    botao.disabled = false;
    if (!res.ok){
      mostrarToast('Erro: ' + res.erro, true);
      return;
    }
    marcacoes[linha] = status;
    mostrarToast(status === 'ENTREGUE' ? 'Marcado como entregue!' : 'Marcado como não entregue.');
    renderCards();
  }catch(err){
    botao.disabled = false;
    mostrarToast('Erro: ' + err, true);
  }
}

// ===== INÍCIO =====
document.getElementById('selData').value = new Date().toISOString().slice(0,10);
carregarMotoristasSelecao();

const motoristaSalvo = localStorage.getItem('motoristaAtual');
if (motoristaSalvo){
  document.getElementById('selMotorista').value = motoristaSalvo;
}
</script>
</body>
</html>
