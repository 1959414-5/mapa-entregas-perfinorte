<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Minhas Entregas — Perfinorte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root{
    --azul:#2f93a3;
    --amber:#e8a23d;
    --verde:#2f9e52;
    --vermelho:#d8622f;
    --bg:#f5f6f8;
    --texto:#1f2430;
    --dim:#6b7280;
    --linha:#e2e5e9;
    --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--texto); font-family:var(--font); -webkit-tap-highlight-color:transparent;}

  header{
    background:#12161b; color:#fff; padding:16px 18px;
    position:sticky; top:0; z-index:10;
  }
  header .eyebrow{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#9aa4b0;}
  header h1{margin:3px 0 0; font-size:19px; font-weight:700;}
  header .sub{margin-top:6px; font-size:12.5px; color:#c7ccd3; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  header .sub button{
    background:none; border:1px solid #3a4250; color:#c7ccd3;
    padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer;
  }
  .tag-localizacao{
    font-size:10.5px; color:var(--verde); display:flex; align-items:center; gap:4px;
  }
  .tag-localizacao.parada{color:var(--dim);}

  #tela-selecao{padding:24px 18px; max-width:420px; margin:0 auto;}
  #tela-selecao h2{font-size:16px; margin-bottom:14px;}
  #tela-selecao label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 5px;}
  #tela-selecao select{
    width:100%; padding:12px; border-radius:8px; border:1px solid var(--linha);
    background:#fff; font-size:16px; color:var(--texto);
  }
  #tela-selecao button{
    margin-top:20px; width:100%; padding:14px; border:none; border-radius:8px;
    background:var(--azul); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }

  #lista{padding:14px; max-width:560px; margin:0 auto; display:none;}

  .abas{display:flex; gap:8px; margin-bottom:12px;}
  .abas button{
    flex:1; padding:11px; border-radius:8px; border:1px solid var(--linha);
    background:#fff; color:var(--dim); font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .abas button.ativa{background:var(--azul); border-color:var(--azul); color:#fff;}

  .modo-visao{display:flex; gap:8px; margin-bottom:12px;}
  .modo-visao button{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--linha);
    background:#fff; color:var(--dim); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .modo-visao button.ativa{background:#12161b; border-color:#12161b; color:#fff;}

  .btn-atualizar{
    display:block; width:100%; margin-bottom:12px; padding:12px;
    border:none; border-radius:10px; background:var(--azul); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-atualizar:disabled{opacity:.6;}

  .resumo{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .resumo .card{
    flex:1; background:#fff; border:1px solid var(--linha); border-radius:10px;
    padding:12px; text-align:center;
  }
  .resumo .card .n{font-size:22px; font-weight:700;}
  .resumo .card .l{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-top:2px;}

  #mapaMotorista{
    display:none; height:340px; border-radius:12px; border:1px solid var(--linha);
    margin-bottom:14px; overflow:hidden;
  }
  .pin-num{
    width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--amber); border:2px solid rgba(0,0,0,.3); box-shadow:0 2px 6px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
  }
  .pin-num span{transform:rotate(45deg); font-size:11px; font-weight:700; color:#1a1305;}

  /* ---------- NAVEGAÇÃO DENTRO DO APP (fica na mesma aba, GPS não pausa) ---------- */
  #modoNavegacao{position:fixed; inset:0; background:#fff; z-index:200; display:flex; flex-direction:column;}
  .nav-header{
    display:flex; gap:8px; padding:12px 14px; background:#12161b;
  }
  .nav-header button{
    flex:1; padding:11px; border:none; border-radius:8px; background:#232a34;
    color:#fff; font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn-iniciar{background:var(--verde) !important; flex:2 !important;}
  .btn-iniciar.seguindo{background:var(--vermelho) !important;}
  .nav-info{
    padding:10px 14px; background:#eef7f8; color:var(--azul);
    font-size:13px; font-weight:700; text-align:center;
  }
  #mapaNavWrap{flex:1; position:relative; overflow:hidden; background:#e5e3df;}
  #mapaNavegacao{position:absolute; inset:0;}
  .pin-caminhao{
    width:36px; height:36px; border-radius:50%;
    background:#fff; border:3px solid var(--azul);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  .pin-destino{
    width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--vermelho); border:2px solid rgba(0,0,0,.3); box-shadow:0 2px 6px rgba(0,0,0,.35);
  }

  .entrega{
    background:#fff; border:1px solid var(--linha); border-radius:12px;
    padding:16px; margin-bottom:12px;
  }
  .entrega.marcada-entregue{border-color:var(--verde); background:#f2fbf5;}
  .entrega.marcada-nao{border-color:var(--vermelho); background:#fdf3ef;}
  .entrega .topo{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .entrega .cliente{font-size:16px; font-weight:700;}
  .entrega .periodo{
    font-size:10.5px; padding:3px 8px; border-radius:20px; white-space:nowrap;
    font-weight:700; letter-spacing:.03em;
  }
  .entrega .periodo.MANHÃ{background:rgba(232,162,61,.18); color:#8a5c14;}
  .entrega .periodo.TARDE{background:rgba(47,147,163,.18); color:#175661;}
  .entrega .status-tag{
    display:inline-block; margin-top:6px; font-size:10.5px; font-weight:700;
    padding:2px 8px; border-radius:20px; background:#eef0f2; color:var(--dim);
  }
  .entrega .endereco{margin-top:6px; font-size:13.5px; color:var(--dim); line-height:1.4;}
  .entrega .acoes{display:flex; gap:8px; margin-top:14px;}
  .entrega .acoes a{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    width:46px; border-radius:8px; border:1px solid var(--linha); background:#fff;
    color:var(--texto); text-decoration:none; font-size:18px;
  }
  .entrega .acoes button{
    flex:1; padding:13px 8px; border-radius:8px; border:1px solid var(--linha);
    background:#fff; font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .entrega .acoes button.entregue-btn.ativo{background:var(--verde); border-color:var(--verde); color:#fff;}
  .entrega .acoes button.nao-btn.ativo{background:var(--vermelho); border-color:var(--vermelho); color:#fff;}
  .entrega .acoes button.btn-nav-interno{
    flex:0 0 auto; width:46px; padding:0; background:var(--azul); border-color:var(--azul);
  }
  .entrega .marcado-em{margin-top:8px; font-size:11px; color:var(--dim);}
  .entrega .ja-marcado-banner{
    margin-top:8px; padding:8px 10px; border-radius:6px;
    background:rgba(47,158,82,.12); color:var(--verde);
    font-size:12.5px; font-weight:700;
  }

  .vazio{text-align:center; padding:60px 20px; color:var(--dim);}
  .vazio .big{font-size:34px; margin-bottom:10px;}

  .barra-progresso-box{padding:40px 30px; text-align:center;}
  .barra-progresso-wrap{
    width:100%; height:8px; background:#eef0f2; border-radius:4px; overflow:hidden;
  }
  .barra-progresso-fill{
    height:100%; width:0%; background:var(--azul); border-radius:4px;
    transition:width .18s ease-out;
  }
  .barra-progresso-texto{
    margin-top:10px; font-size:13px; color:var(--dim); font-weight:700;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translate(-50%,20px);
    background:#12161b; color:#fff; padding:11px 20px; border-radius:8px;
    font-size:13.5px; opacity:0; transition:all .2s ease; pointer-events:none; z-index:999;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .toast.erro{background:var(--vermelho);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Perfinorte · Expedição</div>
  <h1>Minhas Entregas</h1>
  <div class="sub" id="headerSub" style="display:none;">
    <span id="headerInfo"></span>
    <span class="tag-localizacao" id="tagLocalizacao">📍 compartilhando localização</span>
    <button onclick="trocarMotorista()">Trocar</button>
  </div>
</header>

<div id="tela-selecao">
  <h2>Quem é você?</h2>
  <label for="selMotorista">Motorista</label>
  <select id="selMotorista">
    <option value="">Carregando...</option>
  </select>
  <button onclick="iniciarSessao()">Ver minhas entregas</button>
</div>

<div id="lista">
  <div class="abas">
    <button id="btnAbaHoje" class="ativa" onclick="mudarAba_('hoje')">Hoje</button>
    <button id="btnAbaAmanha" onclick="mudarAba_('amanha')">Amanhã</button>
  </div>

  <div class="modo-visao">
    <button id="btnVerLista" class="ativa" onclick="mudarModoVisao_('lista')">📋 Lista</button>
    <button id="btnVerMapaMot" onclick="mudarModoVisao_('mapa')">🗺 Mapa</button>
  </div>

  <button id="btnAtualizar" class="btn-atualizar" onclick="atualizarManual_()">🔄 Atualizar entregas</button>
  <div id="atualizarProgresso" style="display:none; margin-bottom:12px;"></div>

  <div class="resumo">
    <div class="card"><div class="n" id="totCount">–</div><div class="l">Entregas</div></div>
    <div class="card"><div class="n" id="totFeitas">–</div><div class="l">Marcadas</div></div>
  </div>

  <div id="mapaMotorista"></div>
  <div id="cards"></div>
</div>

<div id="modoNavegacao" style="display:none;">
  <div class="nav-header">
    <button onclick="sairNavegacao_()">← Voltar</button>
    <button id="btnIniciarSeguir" class="btn-iniciar" onclick="alternarSeguir_()">▶ Iniciar</button>
    <button onclick="atualizarRotaNavegacao_()">🔄</button>
  </div>
  <div id="navInfo" class="nav-info">Calculando rota…</div>
  <div id="mapaNavWrap"><div id="mapaNavegacao"></div></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
 * COLE AQUI A MESMA URL DO /exec usada no Mapa.html.
 * ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxq2r5WwP_DxFUpO7jV7XthtIGbTLlie8Od799ehwYANEabahf5TitwIt9RqVhXyft6/exec";

let entregasHoje = [];
let entregasAmanha = [];
let marcacoes = {}; // linha -> 'ENTREGUE' | 'NAO_ENTREGUE' (marcações pendentes, de qualquer dia)
let abaAtual = 'hoje';       // 'hoje' | 'amanha'
let modoVisao = 'lista';     // 'lista' | 'mapa'
let mapaMot = null, marcadoresMot = [];

async function chamarAPI_GET_(params){
  // "_t" no final força o navegador a nunca reaproveitar uma resposta em
  // cache — sem isso, às vezes mostra dados antigos mesmo já tendo mudado
  // na planilha de verdade.
  const comCacheBusting = Object.assign({}, params, { _t: Date.now() });
  const qs = new URLSearchParams(comCacheBusting).toString();
  const resp = await fetch(API_URL + '?' + qs, { cache: 'no-store' });
  return await resp.json();
}
async function chamarAPI_POST_(corpo){
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo)
  });
  return await resp.json();
}

function mostrarToast(msg, erro){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (erro ? ' erro' : '');
  setTimeout(() => { t.className = 'toast'; }, 2800);
}

/* Barra de progresso animada — não tem como saber o progresso real de uma
   chamada ao Apps Script (é uma caixa-preta até a resposta voltar), então
   ela sobe suave até 90% enquanto espera e só bate 100% quando os dados
   chegam de verdade — nunca completa sozinha antes da hora. */
function criarBarraProgresso_(containerEl, textoBase){
  containerEl.innerHTML =
    '<div class="barra-progresso-wrap"><div class="barra-progresso-fill"></div></div>' +
    '<div class="barra-progresso-texto">' + textoBase + ' — 0%</div>';
  const fillEl = containerEl.querySelector('.barra-progresso-fill');
  const textoEl = containerEl.querySelector('.barra-progresso-texto');
  let progresso = 0;

  const intervalId = setInterval(() => {
    if (progresso >= 90) return;
    progresso += (90 - progresso) * 0.18 + 2;
    if (progresso > 90) progresso = 90;
    if (fillEl) fillEl.style.width = progresso + '%';
    if (textoEl) textoEl.textContent = textoBase + ' — ' + Math.round(progresso) + '%';
  }, 140);

  return {
    parar: () => clearInterval(intervalId),
    concluir: () => {
      clearInterval(intervalId);
      if (fillEl) fillEl.style.width = '100%';
      if (textoEl) textoEl.textContent = textoBase + ' — 100%';
    }
  };
}

function dataIsoHoje_(){ return new Date().toISOString().slice(0,10); }

// cache simples pra não ficar pedindo o próximo dia útil ao servidor toda
// hora — só busca de novo se passar de uma sessão nova
let proximoDiaUtilCache = null;
async function dataIsoAmanha_(){
  if (proximoDiaUtilCache) return proximoDiaUtilCache;
  try{
    const res = await chamarAPI_GET_({ formato: 'proximoDiaUtil' });
    proximoDiaUtilCache = (res && res.data) || fallbackAmanha_();
  }catch(err){
    proximoDiaUtilCache = fallbackAmanha_();
  }
  return proximoDiaUtilCache;
}
function fallbackAmanha_(){
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0,10);
}
function formatarDataBR_(iso){
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}

async function carregarMotoristasSelecao(){
  const sel = document.getElementById('selMotorista');
  if (!API_URL){
    sel.innerHTML = '<option value="">Configure a API_URL no arquivo</option>';
    return;
  }
  try{
    const lista = await chamarAPI_GET_({ formato: 'motoristas' });
    sel.innerHTML = '<option value="">Selecione...</option>' +
      lista.map(m => `<option value="${m}">${m}</option>`).join('');
    const salvo = localStorage.getItem('motoristaAtual');
    if (salvo) sel.value = salvo;
  }catch(err){
    sel.innerHTML = '<option value="">Erro ao carregar</option>';
  }
}

function trocarMotorista(){
  document.getElementById('lista').style.display = 'none';
  document.getElementById('tela-selecao').style.display = 'block';
  document.getElementById('headerSub').style.display = 'none';
}

async function iniciarSessao(){
  const motorista = document.getElementById('selMotorista').value;
  if (!motorista){
    mostrarToast('Selecione seu nome.', true);
    return;
  }
  localStorage.setItem('motoristaAtual', motorista);

  document.getElementById('tela-selecao').style.display = 'none';
  document.getElementById('lista').style.display = 'block';
  document.getElementById('headerSub').style.display = 'flex';
  document.getElementById('headerInfo').textContent = motorista;

  await carregarEntregasDoMotorista();
  iniciarRastreamento_();
}

function mudarAba_(aba){
  abaAtual = aba;
  document.getElementById('btnAbaHoje').classList.toggle('ativa', aba === 'hoje');
  document.getElementById('btnAbaAmanha').classList.toggle('ativa', aba === 'amanha');
  renderTudo_();
}

function mudarModoVisao_(modo){
  modoVisao = modo;
  document.getElementById('btnVerLista').classList.toggle('ativa', modo === 'lista');
  document.getElementById('btnVerMapaMot').classList.toggle('ativa', modo === 'mapa');
  document.getElementById('cards').style.display = modo === 'lista' ? 'block' : 'none';
  document.getElementById('mapaMotorista').style.display = modo === 'mapa' ? 'block' : 'none';
  if (modo === 'mapa'){
    setTimeout(() => { if (mapaMot) mapaMot.invalidateSize(); renderMapaMotorista_(); }, 50);
  }
}

function listaAtual_(){
  return abaAtual === 'hoje' ? entregasHoje : entregasAmanha;
}

async function carregarEntregasDoMotorista(mostrarCarregando){
  const motorista = localStorage.getItem('motoristaAtual');
  const container = document.getElementById('cards');
  let barra = null;

  if (mostrarCarregando !== false){
    container.innerHTML = '<div class="barra-progresso-box"></div>';
    barra = criarBarraProgresso_(container.querySelector('.barra-progresso-box'), 'Carregando suas entregas');
  }

  try{
    // uma chamada só pro servidor (hoje + amanhã + pendências já vêm
    // juntos) em vez de três separadas — cada chamada ao Apps Script tem
    // um custo próprio de inicialização, então isso fica bem mais rápido
    const resultado = await chamarAPI_GET_({ formato: 'dadosMotorista', motorista: motorista });
    if (barra) barra.concluir();

    const pendentesLista = Array.isArray(resultado.pendentes) ? resultado.pendentes : [];
    marcacoes = {};
    pendentesLista.forEach(p => {
      if (String(p.motorista || '').toUpperCase() === motorista.toUpperCase()){
        marcacoes[p.linha] = p.statusMarcado;
      }
    });

    // HOJE: só o que já está pronto (OK marcado) e ainda não entregue — ou
    // já marcado por ele mesmo (informativo, aguardando confirmação).
    const brutasHoje = Array.isArray(resultado.hoje) ? resultado.hoje : [];
    entregasHoje = brutasHoje.filter(d => {
      if (String(d.status || '').toUpperCase() === 'ENTREGUE') return false;
      if (marcacoes[d.linha] === 'ENTREGUE') return true;
      return d.ok === true;
    });

    // AMANHÃ: mostra tudo, de qualquer status — só pra ele se programar,
    // não precisa estar com pedido pronto ainda.
    entregasAmanha = Array.isArray(resultado.amanha) ? resultado.amanha : [];

    renderTudo_();
  }catch(err){
    if (barra) barra.parar();
    container.innerHTML = '<div class="vazio"><div class="big">⚠</div>Não foi possível carregar.</div>';
  }
}

async function atualizarManual_(){
  const btn = document.getElementById('btnAtualizar');
  const progressoEl = document.getElementById('atualizarProgresso');
  btn.disabled = true;
  progressoEl.style.display = 'block';
  const barra = criarBarraProgresso_(progressoEl, 'Atualizando entregas');

  await carregarEntregasDoMotorista(false); // mantém os cards visíveis, sem tela de carregando

  barra.concluir();
  setTimeout(() => { progressoEl.style.display = 'none'; progressoEl.innerHTML = ''; }, 400);
  btn.disabled = false;
  mostrarToast('Atualizado!');
}

function renderTudo_(){
  renderCards();
  if (modoVisao === 'mapa') renderMapaMotorista_();
}

function renderCards(){
  const lista = listaAtual_();
  const container = document.getElementById('cards');
  document.getElementById('totCount').textContent = lista.length;
  document.getElementById('totFeitas').textContent = lista.filter(d => marcacoes[d.linha]).length;

  if (!lista.length){
    const msg = abaAtual === 'hoje'
      ? 'Nenhuma entrega pendente pra você hoje.'
      : 'Nenhuma entrega prevista pra amanhã ainda.';
    container.innerHTML = '<div class="vazio"><div class="big">📭</div>' + msg + '</div>';
    return;
  }

  container.innerHTML = lista.map(d => {
    const marcado = marcacoes[d.linha];
    const jaEntregue = marcado === 'ENTREGUE';
    const classeCard = jaEntregue ? 'marcada-entregue' : (marcado === 'NAO_ENTREGUE' ? 'marcada-nao' : '');
    const linkMapa = (d.lat != null && d.lng != null)
      ? `<button type="button" class="btn-nav-interno" onclick="iniciarNavegacao_(${d.linha})" title="Navegar aqui dentro do app">🧭</button>` +
        `<a href="https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&travelmode=driving" target="_blank" title="Abrir no Google Maps">↗</a>`
      : '';

    // amanhã mostra tudo, então mostra o status atual pra ele saber a situação
    const statusTag = (abaAtual === 'amanha' && d.status)
      ? '<span class="status-tag">' + d.status + (d.ok ? ' · pronto' : '') + '</span>'
      : '';

    const acoes = (abaAtual !== 'hoje')
      ? '' // amanhã é só consulta, ele ainda não vai marcar nada
      : (jaEntregue
        ? `<div class="acoes">${linkMapa}</div>
           <div class="ja-marcado-banner">✅ Você já marcou como entregue — aguardando confirmação da Viviane</div>`
        : `<div class="acoes">
            ${linkMapa}
            <button class="entregue-btn ${marcado === 'ENTREGUE' ? 'ativo' : ''}" onclick="marcar(${d.linha}, 'ENTREGUE', this)">✅ Entregue</button>
            <button class="nao-btn ${marcado === 'NAO_ENTREGUE' ? 'ativo' : ''}" onclick="marcar(${d.linha}, 'NAO_ENTREGUE', this)">❌ Não entregue</button>
          </div>
          ${marcado === 'NAO_ENTREGUE' ? '<div class="marcado-em">Marcado como não entregue — aguardando revisão da Viviane</div>' : ''}`);

    const linkMapaSemAcao = (abaAtual !== 'hoje' && linkMapa)
      ? `<div class="acoes">${linkMapa}</div>` : '';

    return `
      <div class="entrega ${classeCard}" data-linha="${d.linha}">
        <div class="topo">
          <div class="cliente">${d.cliente}</div>
          <div class="periodo ${d.periodo === 'TARDE' ? 'TARDE' : 'MANHÃ'}">${d.periodo || '—'}</div>
        </div>
        ${statusTag}
        <div class="endereco">${d.endereco}</div>
        ${d.observacoes ? '<div class="endereco">📝 ' + d.observacoes + '</div>' : ''}
        ${acoes}${linkMapaSemAcao}
      </div>`;
  }).join('');
}

/* Mapa geral das paradas do dia selecionado — só pra dar noção de onde é
   cada entrega, não é navegação turno a turno (isso já é o botão 🧭). */
function renderMapaMotorista_(){
  const lista = listaAtual_().filter(d => d.lat != null && d.lng != null);
  const container = document.getElementById('mapaMotorista');
  if (!container || container.style.display === 'none') return;

  if (!mapaMot){
    mapaMot = L.map('mapaMotorista', { zoomControl:true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(mapaMot);
  }

  marcadoresMot.forEach(m => mapaMot.removeLayer(m));
  marcadoresMot = [];

  if (!lista.length){
    mapaMot.setView([-23.42, -52.0], 8);
    return;
  }

  const bounds = [];
  lista.forEach((d, i) => {
    const icone = L.divIcon({
      className:'',
      html:'<div class="pin-num"><span>' + (i+1) + '</span></div>',
      iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24]
    });
    const marker = L.marker([d.lat, d.lng], { icon: icone })
      .bindPopup('<b>' + (i+1) + '. ' + d.cliente + '</b><br>' + d.endereco)
      .addTo(mapaMot);
    marcadoresMot.push(marker);
    bounds.push([d.lat, d.lng]);
  });

  mapaMot.fitBounds(bounds, { padding:[30,30], maxZoom:14 });
}

async function marcar(linha, status, botao){
  const motorista = localStorage.getItem('motoristaAtual');
  botao.disabled = true;

  try{
    const res = await chamarAPI_POST_({ acao: 'marcarEntregaMotorista', linha: linha, status: status, motorista: motorista });
    botao.disabled = false;
    if (!res.ok){
      mostrarToast('Erro: ' + res.erro, true);
      return;
    }
    marcacoes[linha] = status;
    mostrarToast(status === 'ENTREGUE' ? 'Marcado como entregue!' : 'Marcado como não entregue.');
    renderCards();
  }catch(err){
    botao.disabled = false;
    mostrarToast('Erro: ' + err, true);
  }
}

/* ===== LOCALIZAÇÃO EM TEMPO REAL =====
   Manda a posição do GPS pra Viviane conseguir acompanhar no mapa, por até
   10 horas seguidas (uma viagem longa) enquanto essa aba estiver aberta —
   mesmo que ele não toque no celular (não dá, tá dirigindo). Depois de 10h
   o compartilhamento para sozinho, por segurança/bateria. */
const RASTREAMENTO_LIMITE_MS = 10 * 60 * 60 * 1000; // 10 horas
let watchIdLocalizacao = null;
let ultimoEnvioLocalizacao = 0;

/* ===== NAVEGAÇÃO DENTRO DO APP =====
   Mostra a rota + a posição dele ao vivo sem sair da aba — assim o
   rastreamento de localização (pra Viviane) não é pausado, o que
   aconteceria se ele abrisse o Google Maps por cima. */
let mapaNav = null, marcadorNavEu = null, marcadorNavDestino = null;
let destinoNavAtual = null;
let modoSeguindo = false;
let intervalRecalculoRota = null;
const ROTA_SOURCE_ID = 'rota-nav-source';
const ROTA_LAYER_ID = 'rota-nav-layer';

function iniciarNavegacao_(linha){
  const d = listaAtual_().find(x => x.linha === linha);
  if (!d || d.lat == null || d.lng == null) return;

  destinoNavAtual = d;
  document.getElementById('lista').style.display = 'none';
  document.getElementById('modoNavegacao').style.display = 'flex';
  document.getElementById('navInfo').textContent = 'Calculando rota até ' + d.cliente + '…';

  setTimeout(() => {
    if (!mapaNav){
      mapaNav = new maplibregl.Map({
        container: 'mapaNavegacao',
        style: {
          version: 8,
          sources: {
            'carto-tiles': {
              type: 'raster',
              tiles: [
                'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                'https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
              ],
              tileSize: 256,
              attribution: '© OpenStreetMap © CARTO'
            }
          },
          layers: [{ id: 'carto-layer', type: 'raster', source: 'carto-tiles' }]
        },
        center: [d.lng, d.lat], // MapLibre usa [lng, lat], ao contrário do Leaflet
        zoom: 14,
        pitch: 0,
        bearing: 0,
        attributionControl: false
      });
      mapaNav.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
    } else {
      mapaNav.resize();
    }

    const desenharDestino = () => {
      const elDestino = document.createElement('div');
      elDestino.className = 'pin-destino';
      if (marcadorNavDestino) marcadorNavDestino.remove();
      marcadorNavDestino = new maplibregl.Marker({ element: elDestino, anchor: 'bottom' })
        .setLngLat([d.lng, d.lat])
        .setPopup(new maplibregl.Popup({ offset: 20 }).setText(d.cliente))
        .addTo(mapaNav);
      mapaNav.setCenter([d.lng, d.lat]);
      atualizarRotaNavegacao_();
    };

    if (mapaNav.loaded()) desenharDestino(); else mapaNav.on('load', desenharDestino);
  }, 50);
}

function sairNavegacao_(){
  document.getElementById('modoNavegacao').style.display = 'none';
  document.getElementById('lista').style.display = 'block';
  destinoNavAtual = null;
  pararSeguir_();
}

/* "▶ Iniciar" — igual o botão de começar navegação do Google Maps: o mapa
   passa a acompanhar a posição dele ao vivo, gira de verdade conforme a
   direção (câmera em primeira pessoa, rotação nativa do MapLibre — não é
   mais um truque de CSS) e a rota se recalcula sozinha de tempos em tempos. */
function alternarSeguir_(){
  if (modoSeguindo) pararSeguir_(); else iniciarSeguir_();
}

function iniciarSeguir_(){
  modoSeguindo = true;
  const btn = document.getElementById('btnIniciarSeguir');
  btn.textContent = '⏸ Pausar';
  btn.classList.add('seguindo');

  if (mapaNav && marcadorNavEu){
    mapaNav.easeTo({ center: marcadorNavEu.getLngLat(), zoom: 18, pitch: 55, duration: 600 });
  }

  // recalcula a rota sozinho a cada 2 minutos, sem precisar tocar no celular
  if (intervalRecalculoRota) clearInterval(intervalRecalculoRota);
  intervalRecalculoRota = setInterval(atualizarRotaNavegacao_, 2 * 60 * 1000);
}

function pararSeguir_(){
  modoSeguindo = false;
  const btn = document.getElementById('btnIniciarSeguir');
  if (btn){
    btn.textContent = '▶ Iniciar';
    btn.classList.remove('seguindo');
  }
  if (intervalRecalculoRota){
    clearInterval(intervalRecalculoRota);
    intervalRecalculoRota = null;
  }
  if (mapaNav){
    mapaNav.easeTo({ bearing: 0, pitch: 0, duration: 500 }); // volta pro norte-pra-cima normal
  }
}

function atualizarRotaNavegacao_(){
  if (!destinoNavAtual || !navigator.geolocation) return;
  document.getElementById('navInfo').textContent = 'Calculando rota…';

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const origemLat = pos.coords.latitude, origemLng = pos.coords.longitude;
    atualizarPosicaoNav_(origemLat, origemLng, pos.coords.heading);

    try{
      const res = await chamarAPI_GET_({
        formato: 'rotaEntrePontos',
        lat1: origemLat, lng1: origemLng,
        lat2: destinoNavAtual.lat, lng2: destinoNavAtual.lng
      });
      if (!res.ok){
        document.getElementById('navInfo').textContent = 'Não foi possível calcular a rota.';
        return;
      }
      // MapLibre usa GeoJSON com [lng, lat] — o backend devolve [lat, lng]
      // (pro Leaflet do resto do app), então inverte aqui na hora de usar.
      const coordsLngLat = res.pontos.map(p => [p[1], p[0]]);
      const geojson = { type: 'Feature', geometry: { type: 'LineString', coordinates: coordsLngLat } };

      if (mapaNav.getSource(ROTA_SOURCE_ID)){
        mapaNav.getSource(ROTA_SOURCE_ID).setData(geojson);
      } else {
        mapaNav.addSource(ROTA_SOURCE_ID, { type: 'geojson', data: geojson });
        mapaNav.addLayer({
          id: ROTA_LAYER_ID,
          type: 'line',
          source: ROTA_SOURCE_ID,
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#2f93a3', 'line-width': 5, 'line-opacity': 0.85 }
        });
      }

      document.getElementById('navInfo').textContent =
        '📏 ' + res.distanciaKm + ' km · ⏱ ~' + res.duracaoMin + ' min até ' + destinoNavAtual.cliente;

      // no modo "seguindo" a câmera fica fixa nele (não dá pra ver a rota
      // inteira e seguir ao mesmo tempo); parado, mostra a rota inteirinha
      if (!modoSeguindo){
        const bounds = coordsLngLat.reduce(
          (b, c) => b.extend(c),
          new maplibregl.LngLatBounds(coordsLngLat[0], coordsLngLat[0])
        );
        mapaNav.fitBounds(bounds, { padding: 40, duration: 500 });
      }
    }catch(err){
      document.getElementById('navInfo').textContent = 'Erro ao calcular a rota.';
    }
  }, () => {
    document.getElementById('navInfo').textContent = 'Não consegui pegar sua localização — verifique a permissão de GPS.';
  }, { enableHighAccuracy:true, maximumAge:15000, timeout:15000 });
}

function atualizarPosicaoNav_(lat, lng, heading){
  if (!mapaNav) return;

  if (!marcadorNavEu){
    const el = document.createElement('div');
    el.className = 'pin-caminhao';
    el.innerHTML = '🚚';
    marcadorNavEu = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([lng, lat])
      .addTo(mapaNav);
  } else {
    marcadorNavEu.setLngLat([lng, lat]);
  }

  // seguindo ativo: câmera em primeira pessoa de verdade — o MapLibre gira
  // o mapa nativamente (bearing) conforme a direção dele, igual navegação
  // real. Só gira quando o GPS manda uma direção de verdade (parado, sem
  // heading, mantém como estava).
  if (modoSeguindo && mapaNav){
    const opcoes = { center: [lng, lat], zoom: Math.max(mapaNav.getZoom(), 17), duration: 900 };
    if (typeof heading === 'number' && !isNaN(heading)) opcoes.bearing = heading;
    mapaNav.easeTo(opcoes);
  }
}

function iniciarRastreamento_(){
  if (!navigator.geolocation) return;

  // guarda quando a sessão de rastreamento começou, sobrevive a recarregar
  // a página (ex: ele fechou e abriu de novo no meio da viagem)
  let inicio = parseInt(localStorage.getItem('rastreamentoInicio') || '0', 10);
  const agora = Date.now();
  if (!inicio || (agora - inicio) > RASTREAMENTO_LIMITE_MS){
    inicio = agora;
    localStorage.setItem('rastreamentoInicio', String(inicio));
  }

  ativarWatch_();

  // se a aba voltar a ficar visível (ele desbloqueou o celular de novo),
  // manda a posição na hora e garante que o rastreamento ainda está de pé —
  // isso ajuda a "recuperar o atraso" de quando o navegador pausa o GPS
  // com a tela bloqueada/em segundo plano por muito tempo.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){
      verificarLimiteRastreamento_();
      if (watchIdLocalizacao === null) ativarWatch_();
      navigator.geolocation.getCurrentPosition(
        (pos) => enviarLocalizacao_(pos.coords.latitude, pos.coords.longitude, true),
        () => {},
        { enableHighAccuracy:true, maximumAge:15000, timeout:15000 }
      );
    }
  });

  // confere o limite de 10h periodicamente também (não só quando reabre a aba)
  setInterval(verificarLimiteRastreamento_, 5 * 60 * 1000);
}

function ativarWatch_(){
  if (watchIdLocalizacao !== null) return;
  watchIdLocalizacao = navigator.geolocation.watchPosition(
    (pos) => {
      enviarLocalizacao_(pos.coords.latitude, pos.coords.longitude);
      // se estiver no modo navegação, atualiza o pontinho dele no mapa a
      // cada posição nova (mais frequente que o envio pra Viviane, que é
      // limitado a 1x/45s pra economizar bateria/dados)
      if (destinoNavAtual) atualizarPosicaoNav_(pos.coords.latitude, pos.coords.longitude, pos.coords.heading);
    },
    (err) => { console.error('Erro de localização:', err.message); },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
  );
}

function pararRastreamento_(){
  if (watchIdLocalizacao !== null){
    navigator.geolocation.clearWatch(watchIdLocalizacao);
    watchIdLocalizacao = null;
  }
  const tag = document.getElementById('tagLocalizacao');
  if (tag){
    tag.textContent = '📍 compartilhamento encerrado (10h)';
    tag.classList.add('parada');
  }
}

function verificarLimiteRastreamento_(){
  const inicio = parseInt(localStorage.getItem('rastreamentoInicio') || '0', 10);
  if (!inicio) return;
  if (Date.now() - inicio > RASTREAMENTO_LIMITE_MS){
    pararRastreamento_();
  }
}

async function enviarLocalizacao_(lat, lng, forcar){
  const agora = Date.now();
  if (!forcar && (agora - ultimoEnvioLocalizacao < 45000)) return; // no máximo a cada 45s, pra não gastar bateria/dados à toa
  ultimoEnvioLocalizacao = agora;

  const motorista = localStorage.getItem('motoristaAtual');
  if (!motorista) return;
  try{
    await chamarAPI_POST_({ acao: 'atualizarLocalizacao', motorista: motorista, lat: lat, lng: lng });
  }catch(err){
    // silencioso — não vale a pena incomodar o motorista com erro de GPS
  }
}

// ===== INÍCIO =====
carregarMotoristasSelecao();

const motoristaSalvo = localStorage.getItem('motoristaAtual');
if (motoristaSalvo){
  document.getElementById('selMotorista').value = motoristaSalvo;
}
</script>
