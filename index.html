function fecharModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

/* Botão "Aplicar" no campo Endereço — geocodifica e mostra um mini-mapa de
   confirmação, sem salvar nada ainda. */
// Converte o campo pra caixa alta enquanto a pessoa digita, sem o cursor
// pular pro final (problema clássico de forçar .toUpperCase() direto).
function forcarMaiusculo_(e){
  const el = e.target;
  const posicao = el.selectionStart;
  el.value = el.value.toUpperCase();
  el.setSelectionRange(posicao, posicao);
}

function formatarCep_(e){
  let v = e.target.value.replace(/\D/g,'').slice(0,8);
  if (v.length > 5) v = v.slice(0,5) + '-' + v.slice(5);
  e.target.value = v;
}

// Mesma formatação de CEP (00000-000), mas pra usar num valor já pronto
// (ex: vindo da ROTAS_CLIENTES), não de um evento de digitação.
function formatarCepValor_(cep){
  const v = String(cep || '').replace(/\D/g,'').slice(0,8);
  return v.length > 5 ? v.slice(0,5) + '-' + v.slice(5) : v;
}

/* Busca o CEP na ViaCEP (Correios, gratuito, sem chave) e preenche Rua/
   Bairro/Cidade/UF sozinho. Número não vem do CEP — a pessoa completa. */
async function buscarCep(){
  const cep = document.getElementById('novoCep').value.replace(/\D/g,'');
  const resultado = document.getElementById('enderecoResultado');

  if (cep.length !== 8){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'CEP inválido — precisa ter 8 dígitos.';
    return;
  }

  resultado.className = 'busca-resultado carregando';
  resultado.textContent = 'Buscando CEP…';

  try{
    const resp = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
    const dados = await resp.json();
    if (dados.erro){
      resultado.className = 'busca-resultado erro';
      resultado.textContent = 'CEP não encontrado.';
      return;
    }
    document.getElementById('novaRua').value = (dados.logradouro || '').toUpperCase();
    document.getElementById('novoBairro').value = (dados.bairro || '').toUpperCase();
    document.getElementById('novaCidade').value = (dados.localidade || '').toUpperCase();
    document.getElementById('novoUf').value = (dados.uf || '').toUpperCase();
    resultado.className = 'busca-resultado ok';
    resultado.textContent = 'Endereço encontrado — confira o número e clique em Aplicar.';
    document.getElementById('novoNumero').focus();
  }catch(err){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Erro ao buscar CEP: ' + err;
  }
}

/* Monta o endereço no padrão RUA, NÚMERO - BAIRRO - CIDADE/UF a partir dos
   campos separados — assim a pessoa não precisa digitar vírgula/hífen na mão. */
function construirEndereco_(){
  const rua = document.getElementById('novaRua').value.trim();
  const numero = document.getElementById('novoNumero').value.trim() || 'S/N';
  const bairro = document.getElementById('novoBairro').value.trim();
  const cidade = document.getElementById('novaCidade').value.trim();
  const uf = document.getElementById('novoUf').value.trim().toUpperCase();

  if (!rua || !bairro || !cidade || !uf) return null;

  return rua.toUpperCase() + ', ' + numero.toUpperCase() + ' - ' + bairro.toUpperCase() + ' - ' + cidade.toUpperCase() + '/' + uf;
}

/* Tenta separar um endereço já no padrão (ex: vindo da ROTAS_CLIENTES) de
   volta nos campos Rua/Número/Bairro/Cidade/UF, pra pré-preencher o
   formulário. Se o texto não estiver no padrão (rotas antigas tipo
   "PRÓXIMO A PERFINORTE"), devolve null — nesse caso a Rua fica só com o
   texto original, como dica, e a pessoa completa o resto. */
/* Mesma validação de padrão do backend (enderecoNoPadrao_), pro navegador
   já saber se um endereço vindo da ROTAS_CLIENTES é confiável sem precisar
   perguntar pro servidor. */
function enderecoNoPadraoJS_(texto){
  const t = String(texto || '').trim();
  if (!t) return false;
  const partesVirgula = t.split(',');
  if (partesVirgula.length < 2) return false;
  const resto = partesVirgula.slice(1).join(',').trim();
  const segmentos = resto.split('-').map(s => s.trim()).filter(Boolean);
  if (segmentos.length < 2) return false;
  const numero = segmentos[0];
  const cidadeUf = segmentos[segmentos.length - 1];
  const numeroOk = /^(\d+[A-Za-z]?|S\/?N)$/i.test(numero);
  const cidadeUfOk = /^.+\/[A-Za-z]{2}$/.test(cidadeUf);
  return numeroOk && cidadeUfOk;
}

function tentarSepararEndereco_(texto){
  const t = String(texto || '').trim();
  if (!t) return null;
  const partesVirgula = t.split(',');
  if (partesVirgula.length < 2) return null;

  const rua = partesVirgula[0].trim();
  const resto = partesVirgula.slice(1).join(',').trim();
  const segmentos = resto.split('-').map(s => s.trim()).filter(Boolean);
  if (segmentos.length < 2) return null;

  const numero = segmentos[0];
  const cidadeUf = segmentos[segmentos.length - 1];
  const bairro = segmentos.length >= 3 ? segmentos.slice(1, -1).join(' - ') : '';
  const partesCidadeUf = cidadeUf.split('/');
  if (partesCidadeUf.length !== 2) return null;

  return { rua: rua, numero: numero, bairro: bairro, cidade: partesCidadeUf[0].trim(), uf: partesCidadeUf[1].trim() };
}

/* Confirma um endereço já pronto (geocodifica + mostra o mini-mapa) — usada
   tanto pelo botão "Aplicar" (endereço montado dos campos) quanto quando a
   rota já vem certa da ROTAS_CLIENTES (usa o texto original direto, sem
   passar pelos campos). */
async function confirmarEndereco_(endereco){
  const resultado = document.getElementById('enderecoResultado');
  enderecoAplicado = endereco;

  if (!API_URL){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Configure a API_URL no início do arquivo.';
    return;
  }

  resultado.className = 'busca-resultado carregando';
  resultado.textContent = 'Localizando…';

  try{
    const res = await chamarAPI_GET_({ formato: 'geocodificarPreview', endereco: endereco });
    if (!res.ok){
      resultado.className = 'busca-resultado erro';
      resultado.textContent = res.erro;
      document.getElementById('miniMap').style.display = 'none';
      return;
    }
    resultado.className = 'busca-resultado ok';
    resultado.innerHTML = 'Local encontrado ✓<br><small>' + endereco + '</small>';
    mostrarMiniMap_(res.lat, res.lng);
  }catch(err){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Erro: ' + err;
  }
}

async function aplicarEndereco(){
  const resultado = document.getElementById('enderecoResultado');
  const endereco = construirEndereco_();

  if (!endereco){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Preencha rua, bairro, cidade e UF.';
    document.getElementById('miniMap').style.display = 'none';
    return;
  }
  await confirmarEndereco_(endereco);
}

function mostrarMiniMap_(lat, lng){
  const container = document.getElementById('miniMap');
  container.style.display = 'block';
  coordsAjustadasManualmente = null; // reseta — novo endereço aplicado, ajuste antigo não vale mais

  if (!miniMap){
    miniMap = L.map('miniMap', { zoomControl:false, attributionControl:false }).setView([lat, lng], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(miniMap);
    miniMapMarker = L.marker([lat, lng], { draggable: true }).addTo(miniMap);
    miniMapMarker.on('dragend', function(){
      const pos = miniMapMarker.getLatLng();
      coordsAjustadasManualmente = { lat: pos.lat, lng: pos.lng };
      const aviso = document.getElementById('miniMapAviso');
      if (aviso) aviso.textContent = '📍 Posição ajustada manualmente — vai ser salva assim.';
    });
  } else {
    miniMap.setView([lat, lng], 16);
    miniMapMarker.setLatLng([lat, lng]);
  }
  const aviso = document.getElementById('miniMapAviso');
  if (aviso) aviso.textContent = 'Arraste o pino se o local não estiver certinho.';
  // o container só passou a ficar visível agora — Leaflet precisa recalcular o tamanho
  setTimeout(function(){ miniMap.invalidateSize(); }, 80);
}

async function buscarCliente(){
  const codigo = document.getElementById('novoCodigo').value.trim();
  const resultado = document.getElementById('buscaResultado');
  document.getElementById('camposManuais').style.display = 'none';
  document.getElementById('btnSalvarNovo').disabled = true;
  clienteEncontrado = null;

  if (!codigo){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Digite um código de cliente.';
    return;
  }

  if (!API_URL){
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Configure a API_URL no início do arquivo.';
    return;
  }

  const barra = criarBarraProgresso_(resultado, 'Buscando cliente');

  try{
    const info = await chamarAPI_GET_({ formato: 'buscarCliente', codigo: codigo });
    barra.parar();
    if (!info.encontrado){
      resultado.className = 'busca-resultado erro';
      resultado.textContent = info.erro || 'Cliente não encontrado.';
      return;
    }
    clienteEncontrado = info;
    resultado.className = 'busca-resultado ok';
    resultado.innerHTML = '<b>' + info.fantasia + '</b>' + (info.vendedor ? ' · ' + info.vendedor : '');

    // se a rota sugerida já vier pronta e no padrão, confia nela e aplica
    // direto — não precisa a pessoa preencher/clicar em nada
    const jaNoPadrao = enderecoNoPadraoJS_(info.rotaSugerida);
    const partes = tentarSepararEndereco_(info.rotaSugerida);
    if (partes){
      document.getElementById('novaRua').value = partes.rua;
      document.getElementById('novoNumero').value = partes.numero;
      document.getElementById('novoBairro').value = partes.bairro;
      document.getElementById('novaCidade').value = partes.cidade;
      document.getElementById('novoUf').value = partes.uf;
    } else if (info.rotaSugerida){
      // texto antigo fora do padrão — usa só como dica no campo Rua
      document.getElementById('novaRua').value = info.rotaSugerida;
    }

    // CEP e número cadastrados na ROTAS_CLIENTES (colunas E e F) — pré-
    // preenche pra só precisar clicar em "Buscar CEP"
    if (info.cep){
      document.getElementById('novoCep').value = formatarCepValor_(info.cep);
    }
    if (info.numero && !document.getElementById('novoNumero').value){
      document.getElementById('novoNumero').value = String(info.numero).toUpperCase();
    }

    // data sugerida: olha os pedidos desse cliente na ENTREGAS e evita
    // repetir uma data que ele já tem agendada
    if (info.dataSugerida){
      document.getElementById('novaData').value = info.dataSugerida;
    }

    document.getElementById('camposManuais').style.display = 'flex';
    document.getElementById('btnSalvarNovo').disabled = false;

    if (jaNoPadrao){
      await confirmarEndereco_(info.rotaSugerida.trim()); // usa o texto original direto, já é confiável
    }
  }catch(err){
    barra.parar();
    resultado.className = 'busca-resultado erro';
    resultado.textContent = 'Erro: ' + err;
  }
}

document.getElementById('novoPeriodoToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#novoPeriodoToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

async function salvarNova(){
  if (!clienteEncontrado) return;

  const endereco = enderecoAplicado || construirEndereco_();
  if (!endereco){
    mostrarToast('Preencha rua, bairro, cidade e UF, e clique em Aplicar.', true);
    return;
  }

  const periodoBtn = document.querySelector('#novoPeriodoToggle button.active');
  const dados = {
    codigo: clienteEncontrado.codigo,
    fantasia: clienteEncontrado.fantasia,   // já veio do "Buscar" — evita repetir a busca inteira ao salvar
    vendedor: clienteEncontrado.vendedor,
    endereco: endereco,
    motorista: document.getElementById('novoMotorista').value.trim(),
    data: document.getElementById('novaData').value,
    periodo: periodoBtn ? periodoBtn.dataset.p : '',
    observacoes: document.getElementById('novaObs').value.trim()
  };
  // se a pessoa arrastou o pino no mini-mapa pra corrigir a posição, usa
  // essa posição exata em vez de geocodificar de novo — e o backend guarda
  // essa correção, então da próxima vez que alguém usar esse MESMO
  // endereço, já vem certo direto.
  if (coordsAjustadasManualmente){
    dados.latAjustado = coordsAjustadasManualmente.lat;
    dados.lngAjustado = coordsAjustadasManualmente.lng;
  }

  const btn = document.getElementById('btnSalvarNovo');
  const progressoEl = document.getElementById('salvarProgresso');
  btn.disabled = true;
  progressoEl.style.display = 'block';
  const barra = criarBarraProgresso_(progressoEl, 'Salvando entrega');

  try{
    const res = await chamarAPI_POST_({ acao: 'salvarNovaEntrega', dados: dados });
    barra.parar();
    progressoEl.style.display = 'none';
    if (!res.ok){
      mostrarToast('Erro: ' + res.erro, true);
      btn.disabled = false;
      return;
    }
    mostrarToast('Entrega de ' + res.fantasia + ' salva!');
    fecharModal();
    carregarEntregas();
  }catch(err){
    barra.parar();
    progressoEl.style.display = 'none';
    btn.disabled = false;
    mostrarToast('Erro: ' + err, true);
  }
}

function mostrarToast(msg, erro){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (erro ? ' erro' : '');
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

/* Barra de progresso animada — não existe como saber o progresso real
   dentro da execução do Apps Script (é uma chamada só, tipo caixa-preta),
   então ela sobe suave até 90% enquanto espera, e só bate 100% quando a
   resposta chega de verdade (nunca completa sozinha, então nunca "mente"
   dizendo que terminou antes da hora). */
function criarBarraProgresso_(containerEl, textoBase){
  containerEl.className = 'busca-resultado carregando';
  containerEl.innerHTML =
    '<div class="barra-progresso-wrap"><div class="barra-progresso-fill"></div></div>' +
    '<div class="barra-progresso-texto">' + textoBase + ' — 0%</div>';
  const fillEl = containerEl.querySelector('.barra-progresso-fill');
  const textoEl = containerEl.querySelector('.barra-progresso-texto');
  let progresso = 0;

  const intervalId = setInterval(() => {
    if (progresso >= 90) return;
    progresso += (90 - progresso) * 0.18 + 2;
    if (progresso > 90) progresso = 90;
    if (fillEl) fillEl.style.width = progresso + '%';
    if (textoEl) textoEl.textContent = textoBase + ' — ' + Math.round(progresso) + '%';
  }, 140);

  return {
    parar: () => clearInterval(intervalId),
    concluir: () => {
      clearInterval(intervalId);
      if (fillEl) fillEl.style.width = '100%';
      if (textoEl) textoEl.textContent = textoBase + ' — 100%';
    }
  };
}
