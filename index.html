<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Entregas — Perfinorte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --ink:#12161b;
    --panel:#181d24;
    --panel-2:#1f2530;
    --line:#2a313c;
    --paper:#eef1f4;
    --paper-dim:#aab3bf;
    --manha:#e8a23d;
    --tarde:#2f93a3;
    --entregue:#5fae72;
    --fila:#d8622f;
    --andamento:#c9b23d;
    --font-ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-ui);}
  #app{display:grid;grid-template-columns:340px 1fr 300px;height:100vh;transition:grid-template-columns .18s ease;}
  #app.sidebar-colapsado{grid-template-columns:0px 1fr 300px;}
  #app.sidebar-direito-colapsado{grid-template-columns:340px 1fr 0px;}
  #app.sidebar-colapsado.sidebar-direito-colapsado{grid-template-columns:0px 1fr 0px;}

  /* na Tabela, o painel direito some inteiro (não importa se estava aberto
     ou fechado) — evita o bug de layout que dava com os dois abertos */
  #app.tabela-ativa{grid-template-columns:340px 1fr 0px;}
  #app.tabela-ativa.sidebar-colapsado{grid-template-columns:0px 1fr 0px;}

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow-y:auto; overflow-x:hidden;
    min-width:0;
  }
  #app.sidebar-colapsado #sidebar{border-right:none;}
  #sidebar > *{min-width:340px;}

  #sidebarToggle{
    position:fixed; top:50%; left:340px; transform:translateY(-50%);
    width:22px; height:44px; margin-left:-1px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--paper-dim); cursor:pointer;
    border-radius:0 6px 6px 0;
    display:flex; align-items:center; justify-content:center;
    z-index:1500; font-size:12px;
    transition:left .18s ease;
  }
  #sidebarToggle:hover{color:var(--paper);}
  #app.sidebar-colapsado #sidebarToggle{left:0;}

  /* ---------- SIDEBAR DIREITO (lista de entregas) ---------- */
  #sidebarDireito{
    background:var(--panel);
    border-left:1px solid var(--line);
    display:flex; flex-direction:column;
    overflow-y:auto; overflow-x:hidden;
    min-width:0;
  }
  #app.sidebar-direito-colapsado #sidebarDireito{border-left:none;}
  #sidebarDireito > *{min-width:300px;}

  #sidebarDireitoToggle{
    position:fixed; top:50%; right:300px; transform:translateY(-50%);
    width:22px; height:44px; margin-right:-1px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--paper-dim); cursor:pointer;
    border-radius:6px 0 0 6px;
    display:flex; align-items:center; justify-content:center;
    z-index:1500; font-size:12px;
    transition:right .18s ease;
  }
  #sidebarDireitoToggle:hover{color:var(--paper);}
  #app.sidebar-direito-colapsado #sidebarDireitoToggle{right:0;}

  .brand{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .brand .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--paper-dim);
    text-transform:uppercase;
  }
  .brand h1{
    margin:4px 0 0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-.01em;
  }

  .controls{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:12px;
  }
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin-bottom:5px;
  }
  .field input[type=date], .field select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--paper);
    padding:8px 10px;
    border-radius:4px;
    font-size:13.5px;
    font-family:var(--font-ui);
  }
  .field input[type=date]:focus, .field select:focus{
    outline:2px solid var(--manha);outline-offset:1px;
  }

  .status-filtro-sidebar{
    display:flex; flex-direction:column; gap:6px;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:4px; padding:8px 10px;
  }
  .status-filtro-sidebar label{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px; color:var(--paper); cursor:pointer;
  }
  .status-filtro-sidebar input[type=checkbox]{
    accent-color:var(--manha); width:14px; height:14px; cursor:pointer;
  }

  .date-range{display:flex; align-items:center; gap:6px;}
  .date-range input{flex:1; min-width:0;}
  .date-range-sep{color:var(--paper-dim); font-size:11px; flex-shrink:0;}
  .date-atalhos{display:flex; gap:6px; margin-top:6px;}
  .date-atalhos button{
    flex:1; padding:5px 6px; border-radius:4px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim);
    font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; cursor:pointer;
  }
  .date-atalhos button:hover{color:var(--paper); border-color:var(--paper-dim);}

  .period-toggle{display:flex;gap:6px;}
  .period-toggle button{
    flex:1;
    padding:8px 6px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--paper-dim);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:all .12s ease;
  }
  .period-toggle button.active[data-p="MANHÃ"]{background:var(--manha);color:#1a1305;border-color:var(--manha);}
  .period-toggle button.active[data-p="TARDE"]{background:var(--tarde);color:#04191c;border-color:var(--tarde);}
  .period-toggle button.active[data-p=""]{background:var(--paper);color:var(--ink);border-color:var(--paper);}

  .summary{
    padding:14px 20px;
    display:flex;gap:10px;
    border-bottom:1px solid var(--line);
  }
  .summary .stat{flex:1;text-align:left;}
  .summary .stat .n{font-family:var(--font-mono);font-size:22px;font-weight:700;}
  .summary .stat .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);margin-top:2px;}
  .summary .stat.geo-warn .n{color:var(--fila);}

  #list{
    flex:1;
    overflow-y:auto;
    padding:6px 0;
  }
  .item{
    padding:10px 20px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .12s;
  }
  .item:hover{background:var(--panel-2);}
  .item.active{background:var(--panel-2);border-left:3px solid var(--manha);padding-left:17px;}
  .item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .item .cliente{font-weight:600;font-size:13.5px;}
  .item .badge{
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;
    padding:2px 6px;border-radius:3px;white-space:nowrap;
  }
  .badge.MANHÃ{background:rgba(232,162,61,.16);color:var(--manha);}
  .badge.TARDE{background:rgba(47,147,163,.16);color:var(--tarde);}
  .badge-rota{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; margin-right:6px; border-radius:50%;
    background:#2f93a3; color:#fff; font-family:var(--font-mono);
    font-size:9.5px; font-weight:700; vertical-align:middle;
  }
  .item .meta{margin-top:3px;font-size:11.5px;color:var(--paper-dim);}
  .item .meta .dot{margin:0 5px;opacity:.5;}
  .item .status{
    display:inline-block;margin-top:5px;font-family:var(--font-mono);font-size:9.5px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  .status.ENTREGUE{color:var(--entregue);}
  .status.EMFILA{color:var(--fila);}
  .status.EMANDAMENTO{color:var(--andamento);}
  .item .noaddr{color:var(--fila);font-size:10.5px;margin-top:4px;font-family:var(--font-mono);}

  .empty, .loading{
    padding:40px 20px;text-align:center;color:var(--paper-dim);font-size:13px;
  }
  .empty .big, .loading .big{font-size:28px;margin-bottom:8px;}

  /* ---------- MAP ---------- */
  #map{height:100vh;background:#f2efe9;}
  /* corrige as linhas/emendas finas entre os tiles do mapa (bug conhecido do Leaflet) */
  .leaflet-tile-container{transform:scale(1.0005);}
  .leaflet-popup-content-wrapper{
    background:var(--panel);color:var(--paper);border-radius:6px;
    border:1px solid var(--line);
  }
  .leaflet-popup-tip{background:var(--panel);}
  .pop h3{margin:0 0 4px;font-size:14px;}
  .pop .row{font-size:12px;color:var(--paper-dim);margin-top:2px;}
  .pop .row b{color:var(--paper);font-weight:600;}
  .pop .status{
    display:inline-block;margin-top:6px;font-family:var(--font-mono);font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;
  }

  .rotulo-cliente{
    background:#fff; color:#1f2430; border:1px solid rgba(0,0,0,.15);
    border-radius:5px; padding:2px 7px; font-size:11px; font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.25); white-space:nowrap;
  }
  .rotulo-cliente::before{border-top-color:#fff;}

  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    border:2px solid rgba(0,0,0,.35);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .pin span{transform:rotate(45deg);font-family:var(--font-mono);font-size:10px;font-weight:700;color:#12161b;}
  .pin.MANHÃ{background:var(--manha);}
  .pin.TARDE{background:var(--tarde);}

  .pin-origem{
    width:36px; height:36px; border-radius:50%;
    background:#1f2530; border:3px solid #2f93a3;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 3px 10px rgba(0,0,0,.5);
  }

  .pin-motorista{
    width:34px; height:34px; border-radius:50%;
    background:#fff; border:3px solid var(--manha);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; box-shadow:0 3px 10px rgba(0,0,0,.4);
    animation:pulso-motorista 2s infinite;
  }
  @keyframes pulso-motorista{
    0%, 100%{box-shadow:0 3px 10px rgba(0,0,0,.4);}
    50%{box-shadow:0 3px 10px rgba(0,0,0,.4), 0 0 0 6px rgba(232,162,61,.25);}
  }

  .marker-cluster-manha{background:rgba(232,162,61,.5);}
  .marker-cluster-manha div{background:rgba(232,162,61,.85);color:#1a1305;}
  .marker-cluster-tarde{background:rgba(47,147,163,.5);}
  .marker-cluster-tarde div{background:rgba(47,147,163,.85);color:#04191c;}
  .marker-cluster-mix{background:rgba(238,241,244,.35);}
  .marker-cluster-mix div{background:rgba(238,241,244,.85);color:#12161b;}

  #config-banner{
    position:absolute;top:14px;left:360px;right:14px;z-index:1000;
    background:var(--fila);color:#fff;padding:10px 14px;border-radius:6px;
    font-size:12.5px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  #config-banner code{background:rgba(0,0,0,.25);padding:1px 5px;border-radius:3px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---------- NOVA ENTREGA ---------- */
  .btn-nova{
    margin-top:10px;
    width:100%;
    padding:8px 10px;
    background:var(--manha);
    color:#1a1305;
    border:none;
    border-radius:4px;
    font-family:var(--font-mono);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .btn-nova:hover{opacity:.9;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center;
    z-index:2000;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    width:400px; max-width:92vw; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .modal-header h2{margin:0; font-size:16px;}
  .modal-close{
    background:none; border:none; color:var(--paper-dim); font-size:20px;
    cursor:pointer; line-height:1;
  }
  .modal-body{padding:16px 20px; display:flex; flex-direction:column; gap:14px;}
  .modal-body input[type=text], .modal-body input[type=date], .modal-body select{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--paper); padding:8px 10px; border-radius:4px; font-size:13.5px;
    font-family:var(--font-ui);
  }
  #miniMap{
    display:none; height:170px; border-radius:4px; margin-top:8px;
    border:1px solid var(--line); overflow:hidden; cursor:grab;
  }
  .mini-map-aviso{
    margin-top:6px; font-size:11px; color:var(--paper-dim); text-align:center;
  }
  .busca-linha{display:flex; gap:8px;}
  .endereco-linha{display:flex; gap:8px;}
  .endereco-linha input{flex:1; min-width:0;}
  .busca-linha input{flex:1;}
  .busca-resultado{
    font-size:12.5px; padding:8px 10px; border-radius:4px;
    background:var(--panel-2); color:var(--paper-dim); display:none;
  }
  .busca-resultado.ok{color:var(--entregue); background:rgba(95,174,114,.12); display:block;}
  .busca-resultado.erro{color:var(--fila); background:rgba(216,98,47,.12); display:block;}
  .busca-resultado.carregando{display:block;}

  .barra-progresso-wrap{
    width:100%; height:7px; background:rgba(255,255,255,.12);
    border-radius:4px; overflow:hidden;
  }
  .barra-progresso-fill{
    height:100%; width:0%; background:var(--manha); border-radius:4px;
    transition:width .18s ease-out;
  }
  .barra-progresso-texto{
    margin-top:6px; font-family:var(--font-mono); font-size:11px;
    color:var(--paper-dim); text-align:center; letter-spacing:.03em;
  }

  .modal-footer{
    display:flex; justify-content:flex-end; gap:8px;
    padding:14px 20px; border-top:1px solid var(--line);
  }
  .btn-secondary{
    padding:8px 14px; background:var(--panel-2); color:var(--paper);
    border:1px solid var(--line); border-radius:4px; font-size:12.5px; cursor:pointer;
  }
  .btn-primary{
    padding:8px 14px; background:var(--manha); color:#1a1305;
    border:none; border-radius:4px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}

  .btn-aplicar{
    width:100%; margin-top:8px; padding:11px 14px;
    background:var(--manha); color:#1a1305; border:none; border-radius:6px;
    font-size:13.5px; font-weight:700; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 2px 8px rgba(232,162,61,.35);
  }
  .btn-aplicar:hover{background:#f0ac4d;}
  .btn-aplicar:active{transform:translateY(1px); box-shadow:0 1px 4px rgba(232,162,61,.3);}

  .btn-cep{
    flex-shrink:0; padding:0 16px; border:none; border-radius:6px;
    background:var(--tarde); color:#fff; font-size:12.5px; font-weight:700;
    letter-spacing:.02em; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,147,163,.35);
  }
  .btn-cep:hover{background:#39a8b9;}
  .btn-cep:active{transform:translateY(1px); box-shadow:0 1px 4px rgba(47,147,163,.3);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translate(-50%,20px);
    background:var(--panel); border:1px solid var(--line); color:var(--paper);
    padding:10px 18px; border-radius:6px; font-size:13px; opacity:0;
    transition:all .2s ease; pointer-events:none; z-index:3000;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .toast.erro{border-color:var(--fila); color:var(--fila);}

  /* ---------- ALTERNAR MAPA / TABELA ---------- */
  .view-toggle{display:flex; gap:6px; margin-top:8px;}
  .view-toggle button{
    flex:1; padding:7px 6px; border-radius:4px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em;
    cursor:pointer;
  }
  .view-toggle button.active{background:var(--paper); color:var(--ink); border-color:var(--paper);}

  .rota-info{
    margin-top:8px; padding:9px 12px; border-radius:4px;
    background:rgba(47,147,163,.14); border:1px solid rgba(47,147,163,.4);
    font-family:var(--font-mono); font-size:11px; color:var(--tarde);
    display:flex; justify-content:space-between; gap:8px;
  }

  .btn-confirmacoes{
    margin-top:10px; width:100%; padding:8px 10px;
    background:var(--panel-2); color:var(--paper-dim);
    border:1px solid var(--line); border-radius:4px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
    cursor:pointer;
  }
  .btn-confirmacoes.tem-pendentes{
    background:rgba(216,98,47,.16); color:var(--fila); border-color:var(--fila);
    font-weight:700;
  }

  .confirmacao-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .confirmacao-item:last-child{border-bottom:none;}
  .confirmacao-item .info b{font-size:13.5px;}
  .confirmacao-item .info small{display:block; margin-top:2px; font-size:11px;}

  /* ---------- TABELA (sempre clara, independente do tema escuro do resto) ---------- */
  #tableView{
    display:none; height:100vh; overflow:auto; padding:20px;
    background:#ffffff; color:#1f2430;
  }
  .tabela-toolbar{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px;
    margin-bottom:12px;
  }
  .tabela-toolbar .contagem{
    font-family:var(--font-mono); font-size:11px; color:#4b5563;
  }
  .tabela-controles{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .periodo-tabela{display:flex; border:1px solid #c7ccd3; border-radius:4px; overflow:hidden;}
  .periodo-tabela button{
    padding:5px 10px; border:none; background:#fff; color:#4b5563;
    font-size:10.5px; font-family:var(--font-mono); cursor:pointer;
    border-right:1px solid #c7ccd3;
  }
  .periodo-tabela button:last-child{border-right:none;}
  .periodo-tabela button.active{background:var(--manha); color:#1a1305; font-weight:700;}
  .btn-toggle-tabela{
    padding:5px 10px; border:1px solid #c7ccd3; border-radius:4px;
    background:#fff; color:#4b5563; font-size:10.5px; font-family:var(--font-mono);
    cursor:pointer;
  }
  .btn-toggle-tabela.active{background:var(--tarde); color:#fff; border-color:var(--tarde); font-weight:700;}

  .legenda{display:flex; gap:12px; flex-wrap:wrap;}
  .legenda span{
    display:flex; align-items:center; gap:5px;
    font-size:10.5px; color:#374151;
  }
  .legenda i{
    display:inline-block; width:10px; height:10px; border-radius:2px;
    border:1px solid rgba(0,0,0,.25);
  }
  .tabela-entregas{
    width:100%; min-width:1100px; border-collapse:collapse; font-size:11px;
    background:#ffffff; border:1px solid #d5a6bd; table-layout:fixed;
  }
  .tabela-entregas.largura-percentual{min-width:0; width:100%;}
  .tabela-entregas th{
    text-align:left; padding:7px 8px; border:1px solid #d5a6bd;
    font-family:var(--font-mono); font-size:9px; letter-spacing:.06em;
    text-transform:uppercase; color:#1f2430; position:sticky; top:0;
    background:#f0f0f0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .tabela-entregas td{
    padding:3px 6px; border:1px solid #d5a6bd; vertical-align:middle;
    overflow:hidden; text-overflow:ellipsis; color:#1f2430;
  }
  .tabela-entregas.condensada th{padding:4px 6px; font-size:8px;}
  .tabela-entregas.condensada td{padding:0 4px; font-size:10px; line-height:1.5;}
  .tabela-entregas.condensada .td-input{padding:1px 4px; font-size:10px;}
  .tabela-entregas.condensada .btn-remover{font-size:11px; padding:1px;}
  .col-resize-handle{

<script>
/* =====================================================================
 * COLE AQUI A URL DO SEU /exec — copie direto da barra de endereços do
 * navegador (não digite/transcreva, pra não errar nenhum caractere).
 * Exemplo: "https://script.google.com/macros/s/AKfycb.../exec"
 * ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxq2r5WwP_DxFUpO7jV7XthtIGbTLlie8Od799ehwYANEabahf5TitwIt9RqVhXyft6/exec";

/* Dados de exemplo usados só se a API_URL acima ficar vazia. */
const DADOS_EXEMPLO = [
  {cliente:"BECKHAUSER", motorista:"GENTIL", data:new Date().toISOString().slice(0,10), periodo:"MANHÃ", status:"ENTREGUE", cidade:"MARINGA", endereco:"Av. Colombo, 5790 - Maringá/PR", observacoes:"", lat:-23.4205, lng:-51.9331},
  {cliente:"PIU MOBILE ESTOFADOS", motorista:"GENTIL", data:new Date().toISOString().slice(0,10), periodo:"MANHÃ", status:"ENTREGUE", cidade:"MARINGA", endereco:"Contorno Sul, 1200 - Maringá/PR", observacoes:"", lat:-23.4395, lng:-51.9270},
  {cliente:"RECUPERA", motorista:"JOÃO", data:new Date().toISOString().slice(0,10), periodo:"TARDE", status:"EM FILA", cidade:"CIANORTE", endereco:"Rua Minas Gerais, 500 - Cianorte/PR", observacoes:"", lat:-23.6633, lng:-52.6053},
  {cliente:"KONSTRUA IMPLEMENTOS", motorista:"GENTIL", data:new Date().toISOString().slice(0,10), periodo:"TARDE", status:"ENTREGUE", cidade:"MARINGA", endereco:"Contorno Norte, 800 - Maringá/PR", observacoes:"Entregar na Metalúrgica Metalpaz", lat:-23.3850, lng:-51.9450},
  {cliente:"SAUTEC", motorista:"JOÃO", data:new Date().toISOString().slice(0,10), periodo:"MANHÃ", status:"EM ANDAMENTO", cidade:"ARARUNA", endereco:"Rua Paraná, 120 - Ararununa/PR", observacoes:"", lat:-23.9500, lng:-52.4900},
];

let map, clusterManha, clusterTarde, markersById = {};
let rotaSugerida = null; // array de "linha" na ordem sugerida (ou null se nenhuma rota ativa)
let rotaGeometria = null; // polyline codificada da rota real (pelas ruas), devolvida pelo OpenRouteService
let marcadorPerfinorteFixo = null;  // ícone da fábrica, sempre visível no mapa (não depende de rota ativa)
let rotaOrigem = null;   // {lat, lng} da Perfinorte, devolvido junto com a rota
let rotaLinha = null;    // camada do Leaflet com a linha da rota desenhada
let rotaSetas = null;    // camada com as setas de direção sobre a linha
let markersMotoristas = {}; // motorista -> marcador no mapa
let todasEntregas = [];   // tudo que veio da planilha, sem filtro nenhum
let entregasAtuais = [];  // resultado filtrado pro MAPA (inclui o status do sidebar)
let entregasParaTabela = []; // resultado filtrado pra TABELA (sem o status do sidebar — ela tem o filtro próprio)
let filtroPeriodo = "";
let selecionadoIdx = null;
let modoAtual = 'mapa';
let clienteEncontrado = null;
let enderecoAplicado = ''; // endereço já montado no padrão, depois de clicar "Aplicar"
let motoristasDisponiveis = [];
let miniMap = null, miniMapMarker = null;
let coordsAjustadasManualmente = null; // {lat, lng} — preenchido só se a pessoa arrastar o pino
let filtroStatusSidebar = new Set(['ENTREGUE','EM ANDAMENTO','EM FILA']); // todos marcados por padrão — só afeta o mapa
let filtroOkSidebar = ''; // '' = todos, 'sim' = só prontos, 'nao' = só não prontos — só afeta o mapa

function alternarStatusSidebar_(chk){
  if (chk.checked) filtroStatusSidebar.add(chk.value); else filtroStatusSidebar.delete(chk.value);
  aplicarFiltros();
}

function definirFiltroOk_(valor){
  filtroOkSidebar = valor;
  document.querySelectorAll('#okToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.ok === valor);
  });
  salvarPreferencias();
  aplicarFiltros();
}

function definirDataAtalho_(qual){
  const hoje = new Date().toISOString().slice(0,10);
  if (qual === 'hoje'){
    document.getElementById('dataDeInput').value = hoje;
    document.getElementById('dataAteInput').value = hoje;
    aplicarFiltros();
  } else if (qual === 'amanha'){
    // usa o próximo dia útil de verdade (pula fim de semana/feriado),
    // igual o app do motorista
    chamarAPI_GET_({ formato: 'proximoDiaUtil' }).then(res => {
      const data = (res && res.data) || hoje;
      document.getElementById('dataDeInput').value = data;
      document.getElementById('dataAteInput').value = data;
      aplicarFiltros();
    }).catch(() => {
      document.getElementById('dataDeInput').value = hoje;
      document.getElementById('dataAteInput').value = hoje;
      aplicarFiltros();
    });
  }
}

/* ----- preferências salvas no navegador (sobrevivem a atualizar a página) ----- */
const PREF_CHAVE = 'mapaEntregasPerfinorte';
function salvarPreferencias(){
  try{
    localStorage.setItem(PREF_CHAVE, JSON.stringify({
      dataDe: document.getElementById('dataDeInput').value,
      dataAte: document.getElementById('dataAteInput').value,
      periodo: filtroPeriodo,
      motorista: document.getElementById('motoristaSelect').value,
      status: Array.from(filtroStatusSidebar),
      ok: filtroOkSidebar
    }));
  }catch(e){ /* localStorage indisponível — segue sem salvar */ }
}
function carregarPreferencias(){
  const hoje = new Date().toISOString().slice(0,10);
  let salvo = {};
  try{ salvo = JSON.parse(localStorage.getItem(PREF_CHAVE) || '{}'); }catch(e){ salvo = {}; }

  // Data: usa o que ficou salvo da última vez; na primeira visita, hoje até hoje.
  document.getElementById('dataDeInput').value = salvo.dataDe || hoje;
  document.getElementById('dataAteInput').value = salvo.dataAte || hoje;

  if (salvo.periodo){
    filtroPeriodo = salvo.periodo;
    document.querySelectorAll('#periodoToggle button').forEach(b=>{
      b.classList.toggle('active', b.dataset.p === salvo.periodo);
    });
  }
  window.__motoristaSalvo = salvo.motorista || '';

  if (Array.isArray(salvo.status)){
    filtroStatusSidebar = new Set(salvo.status);
    document.querySelectorAll('#statusFiltroSidebar input[type=checkbox]').forEach(chk => {
      chk.checked = filtroStatusSidebar.has(chk.value);
    });
  }

  if (typeof salvo.ok === 'string'){
    filtroOkSidebar = salvo.ok;
    document.querySelectorAll('#okToggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.ok === salvo.ok);
    });
  }
}

/* ----- painel lateral minimizado/maximizado (salvo separado, não expira) ----- */
const SIDEBAR_CHAVE = 'mapaEntregasSidebarColapsado';

function restaurarSidebar_(){
  let colapsado = false;
  try{ colapsado = localStorage.getItem(SIDEBAR_CHAVE) === '1'; }catch(e){ colapsado = false; }
  document.getElementById('app').classList.toggle('sidebar-colapsado', colapsado);
  document.getElementById('sidebarToggle').textContent = colapsado ? '›' : '‹';
}

function alternarSidebar(){
  const app = document.getElementById('app');
  app.classList.toggle('sidebar-colapsado');
  const colapsado = app.classList.contains('sidebar-colapsado');
  document.getElementById('sidebarToggle').textContent = colapsado ? '›' : '‹';
  try{ localStorage.setItem(SIDEBAR_CHAVE, colapsado ? '1' : '0'); }catch(e){}
  // o mapa precisa recalcular o tamanho depois que a transição de largura terminar
  setTimeout(function(){ if (map) map.invalidateSize(); }, 200);
}

/* ----- painel direito (lista de entregas) — mesma ideia, chave separada ----- */
const SIDEBAR_DIREITO_CHAVE = 'mapaEntregasSidebarDireitoColapsado';

function restaurarSidebarDireito_(){
  let colapsado = false;
  try{ colapsado = localStorage.getItem(SIDEBAR_DIREITO_CHAVE) === '1'; }catch(e){ colapsado = false; }
  document.getElementById('app').classList.toggle('sidebar-direito-colapsado', colapsado);
  document.getElementById('sidebarDireitoToggle').textContent = colapsado ? '‹' : '›';
}

function alternarSidebarDireito_(){
  const app = document.getElementById('app');
  app.classList.toggle('sidebar-direito-colapsado');
  const colapsado = app.classList.contains('sidebar-direito-colapsado');
  document.getElementById('sidebarDireitoToggle').textContent = colapsado ? '‹' : '›';
  try{ localStorage.setItem(SIDEBAR_DIREITO_CHAVE, colapsado ? '1' : '0'); }catch(e){}
  setTimeout(function(){ if (map) map.invalidateSize(); }, 200);
}

function initMap(){
  map = L.map('map', { zoomControl:true }).setView([-23.42, -52.0], 8);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  clusterManha = L.markerClusterGroup({ iconCreateFunction: makeClusterIcon('manha') });
  clusterTarde = L.markerClusterGroup({ iconCreateFunction: makeClusterIcon('tarde') });
  map.addLayer(clusterManha);
  map.addLayer(clusterTarde);
}

function makeClusterIcon(kind){
  return function(cluster){
    const count = cluster.getChildCount();
    return L.divIcon({
      html: `<div>${count}</div>`,
      className: 'marker-cluster marker-cluster-' + kind,
      iconSize: L.point(38,38)
    });
  };
}

function pinIcon(periodo){
  const cls = periodo === 'TARDE' ? 'TARDE' : 'MANHÃ';
  const letra = periodo === 'TARDE' ? 'T' : 'M';
  return L.divIcon({
    className:'',
    html:`<div class="pin ${cls}"><span>${letra}</span></div>`,
    iconSize:[26,26],
    iconAnchor:[13,26],
    popupAnchor:[0,-24]
  });
}

// Pino numerado — usado quando tem uma rota sugerida ativa, mostra a ordem
// de visita (1, 2, 3...) em vez da letra de período.
function pinIconNumerado_(numero, periodo){
  const cls = periodo === 'TARDE' ? 'TARDE' : 'MANHÃ';
  return L.divIcon({
    className:'',
    html:`<div class="pin ${cls}"><span>${numero}</span></div>`,
    iconSize:[28,28],
    iconAnchor:[14,28],
    popupAnchor:[0,-26]
  });
}

// Ícone da Perfinorte (ponto de partida/chegada da rota sugerida) — um
// círculo com uma fábrica, bem diferente dos pinos de entrega pra não
// confundir qual é a origem.
function origemIcon_(){
  return L.divIcon({
    className:'',
    html:'<div class="pin-origem">🏭</div>',
    iconSize:[36,36],
    iconAnchor:[18,18],
    popupAnchor:[0,-20]
  });
}

/* Carrega uma vez o ícone fixo da Perfinorte no mapa — sempre visível,
   independente de ter rota sugerida ativa ou não, só pra qualquer um se
   localizar em relação à empresa. */
async function carregarMarcadorPerfinorte_(){
  if (!API_URL || marcadorPerfinorteFixo) return;
  try{
    const res = await chamarAPI_GET_({ formato: 'origemPerfinorte' });
    if (!res.ok) return;
    marcadorPerfinorteFixo = L.marker([res.lat, res.lng], { icon: origemIcon_(), zIndexOffset: 500 })
      .bindPopup('<div class="pop"><h3>🏭 Perfinorte</h3><div class="row">' + (res.endereco || '') + '</div></div>')
      .addTo(map);
  }catch(err){
    // silencioso — não interrompe o resto do mapa
  }
}

function motoristaIcon_(){
  return L.divIcon({
    className:'',
    html:'<div class="pin-motorista">🚚</div>',
    iconSize:[34,34],
    iconAnchor:[17,17],
    popupAnchor:[0,-18]
  });
}

// Texto tipo "há 3 min" a partir de um timestamp ISO.
function tempoRelativo_(isoTexto){
  if (!isoTexto) return '';
  const diffMs = Date.now() - new Date(isoTexto).getTime();
  const min = Math.round(diffMs / 60000);
  if (min < 1) return 'agora mesmo';
  if (min === 1) return 'há 1 min';
  if (min < 60) return 'há ' + min + ' min';
  const h = Math.round(min / 60);
  return 'há ' + h + (h === 1 ? ' hora' : ' horas');
}

/* Busca as localizações mais recentes de cada motorista e desenha (ou
   atualiza) o marcador dele no mapa. Some sozinho da tela se não vier
   atualização nova há mais de 20 minutos (motorista fechou o app). */
async function carregarLocalizacoesMotoristas(){
  if (!API_URL) return;
  try{
    const lista = await chamarAPI_GET_({ formato: 'localizacoesMotoristas' });
    const agora = Date.now();
    const vistos = new Set();

    (Array.isArray(lista) ? lista : []).forEach(loc => {
      const idadeMin = (agora - new Date(loc.atualizadoEm).getTime()) / 60000;
      if (idadeMin > 20) return; // muito antigo, provavelmente offline — não mostra

      vistos.add(loc.motorista);
      const popupHtml = '<div class="pop"><h3>🚚 ' + loc.motorista + '</h3>' +
        '<div class="row">Atualizado ' + tempoRelativo_(loc.atualizadoEm) + '</div>' +
        '<button class="btn-secondary" style="margin-top:8px;" onclick="calcularEtaMotorista_(' + loc.lat + ',' + loc.lng + ', this)">📍 Tempo até a base</button>' +
        '<div class="eta-resultado" style="margin-top:6px; font-size:12px;"></div>' +
        '</div>';

      if (markersMotoristas[loc.motorista]){
        markersMotoristas[loc.motorista].setLatLng([loc.lat, loc.lng]);
        markersMotoristas[loc.motorista].setPopupContent(popupHtml);
      } else {
        markersMotoristas[loc.motorista] = L.marker([loc.lat, loc.lng], { icon: motoristaIcon_() })
          .bindPopup(popupHtml)
          .addTo(map);
      }
    });

    // remove do mapa quem não apareceu dessa vez (ficou offline/antigo)
    Object.keys(markersMotoristas).forEach(nome => {
      if (!vistos.has(nome)){
        map.removeLayer(markersMotoristas[nome]);
        delete markersMotoristas[nome];
      }
    });
  }catch(err){
    // silencioso — não interrompe o resto do mapa
  }
}

/* Chamada pelo botão dentro do popup do motorista — calcula sob demanda
   (não a cada atualização) pra não gastar a cota gratuita da API à toa. */
async function calcularEtaMotorista_(lat, lng, botao){
  const resultado = botao.nextElementSibling;
  resultado.textContent = 'Calculando…';
  try{
    const res = await chamarAPI_GET_({ formato: 'etaBase', lat: lat, lng: lng });
    if (!res.ok){
      resultado.textContent = 'Erro: ' + res.erro;
      return;
    }
    resultado.textContent = '📏 ' + res.distanciaKm + ' km · ⏱ ~' + res.duracaoMin + ' min até a Perfinorte';
  }catch(err){
    resultado.textContent = 'Erro: ' + err;
  }
}

// Decodifica a polyline que o OpenRouteService devolve (formato padrão de
// precisão 5) numa lista de pontos [lat,lng] que o Leaflet entende.
function decodificarPolyline_(str){
  const precisao = 1e5;
  let index = 0, lat = 0, lng = 0;
  const coords = [];
  while (index < str.length){
    let shift = 0, result = 0, byte;
    do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);

    shift = 0; result = 0;
    do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);

    coords.push([lat / precisao, lng / precisao]);
  }
  return coords;
}

function statusClass(status){
  return String(status||'').toUpperCase().replace(/\s+/g,'');
}

// Converte "2026-08-07" (formato usado internamente pros filtros) em
// "07/08/2026" (formato brasileiro) só pra exibição.
function formatarDataBR_(iso){
  if (!iso) return '';
  const partes = iso.split('-');
  if (partes.length !== 3) return iso;
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}

/* ===== COMUNICAÇÃO COM A API (esta página é externa ao Apps Script agora —
   GitHub Pages — então TUDO passa por fetch(), nunca google.script.run). ===== */
async function chamarAPI_GET_(params){
  // "_t" no final força o navegador a nunca reaproveitar uma resposta em
  // cache — sem isso, às vezes ele mostra dados antigos mesmo já tendo
  // mudado na planilha de verdade.
  const comCacheBusting = Object.assign({}, params, { _t: Date.now() });
  const qs = new URLSearchParams(comCacheBusting).toString();
  const resp = await fetch(API_URL + '?' + qs, { cache: 'no-store' });
  return await resp.json();
}
async function chamarAPI_POST_(corpo){
  // Content-Type "text/plain" de propósito — evita o preflight de CORS
  // (OPTIONS) que o Apps Script Web App não sabe responder; o Apps Script
  // lê e interpreta o corpo como JSON normalmente do mesmo jeito.
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo)
  });
  return await resp.json();
}

/* Busca TUDO na planilha, sem filtro nenhum — chamada só no carregamento
   inicial e pela atualização automática. Trocar data/período/motorista/status
   NÃO chama isso; só reaplica o filtro em cima do que já foi carregado. */
async function carregarEntregas(){
  // Só mostra "Carregando..." na primeiríssima vez (lista ainda vazia).
  // Nas atualizações automáticas seguintes, a lista atual continua visível
  // até os dados novos chegarem — sem esse "piscar" a cada 20s.
  const primeiraCarga = todasEntregas.length === 0;
  if (primeiraCarga){
    document.getElementById('list').innerHTML = '<div class="loading"><div class="big">⏳</div>Carregando entregas…</div>';
  }

  if (!API_URL){
    document.getElementById('config-banner').style.display = 'block';
    todasEntregas = DADOS_EXEMPLO;
    populaMotoristas();
    aplicarFiltros();
    return;
  }

  try{
    const resp = await fetch(API_URL + '?formato=dados');
    const dados = await resp.json();
    todasEntregas = Array.isArray(dados) ? dados : [];
    document.getElementById('ultimaAtualizacao').textContent =
      'atualizado ' + new Date().toLocaleTimeString('pt-BR');
    populaMotoristas();
    // só ajusta o zoom/enquadramento na primeiríssima carga — nas
    // atualizações automáticas seguintes, mantém o zoom/posição que a
    // pessoa deixou no mapa
    aplicarFiltros(primeiraCarga);
  }catch(err){
    if (primeiraCarga){
      document.getElementById('list').innerHTML =
        '<div class="empty"><div class="big">⚠</div>Não foi possível carregar os dados.<br><small>' + err + '</small></div>';
    } else {
      // atualização automática falhou — não interrompe a visualização atual,
      // só registra no console pra depuração se precisar
      console.error('Atualização automática falhou:', err);
    }
  }
}

/* Filtra o que já está em memória (todasEntregas) — instantâneo, sem ir na
   planilha de novo. Chamada toda vez que a pessoa muda data/período/
   motorista/status (nesses casos ajustarZoom fica true, o padrão — faz
   sentido reenquadrar o mapa quando o conjunto visível muda de verdade). */
function aplicarFiltros(ajustarZoom){
  if (ajustarZoom === undefined) ajustarZoom = true;

  const dataDe = document.getElementById('dataDeInput').value;
  const dataAte = document.getElementById('dataAteInput').value;
  const motorista = document.getElementById('motoristaSelect').value;

  // filtros do sidebar (data/período/motorista/status) só valem pro MAPA —
  // a tabela é 100% independente, com os filtros dela mesma (status e
  // período próprios, na própria tabela).
  entregasAtuais = todasEntregas.filter(d => {
    if (dataDe && d.data && d.data < dataDe) return false;
    if (dataAte && d.data && d.data > dataAte) return false;
    if (filtroPeriodo && d.periodo !== filtroPeriodo) return false;
    if (motorista && String(d.motorista||'').toUpperCase() !== motorista.toUpperCase()) return false;
    const chaveStatus = String(d.status || '').trim().toUpperCase() || 'VAZIO';
    if (!filtroStatusSidebar.has(chaveStatus)) return false;
    if (filtroOkSidebar === 'sim' && d.ok !== true) return false;
    if (filtroOkSidebar === 'nao' && d.ok === true) return false;
    return true;
  });

  entregasParaTabela = todasEntregas;

  salvarPreferencias();
  if (modoAtual === 'tabela') renderTabela(ajustarZoom === false); else render(ajustarZoom);
}

function populaMotoristas(){
  const sel = document.getElementById('motoristaSelect');
  const atual = sel.value || window.__motoristaSalvo || '';
  const nomes = [...new Set(todasEntregas.map(d=>d.motorista).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos</option>' + nomes.map(n=>`<option value="${n}">${n}</option>`).join('');
  sel.value = atual;
  window.__motoristaSalvo = ''; // só usa a preferência salva na primeira vez
}

function render(ajustarZoom){
  if (ajustarZoom === undefined) ajustarZoom = true;
  clusterManha.clearLayers();
  clusterTarde.clearLayers();
  markersById = {};

  const list = document.getElementById('list');
  const cidades = new Set();
  let semGeo = 0;
  const bounds = [];

  if (!entregasAtuais.length){
    list.innerHTML = '<div class="empty"><div class="big">📭</div>Nenhuma entrega encontrada<br>para esses filtros.</div>';
  } else {
    list.innerHTML = entregasAtuais.map((d, i) => {
      const badgeClass = d.periodo === 'TARDE' ? 'TARDE' : 'MANHÃ';
      const semEndereco = (d.lat == null || d.lng == null);
      const numeroRota = rotaSugerida ? rotaSugerida.indexOf(d.linha) + 1 : 0;
      const badgeRota = numeroRota > 0 ? `<span class="badge-rota">${numeroRota}</span>` : '';
      return `
        <div class="item" data-idx="${i}" onclick="focarEntrega(${i})">
          <div class="top">
            <span class="cliente">${badgeRota}${d.cliente}</span>
            <span class="badge ${badgeClass}">${d.periodo || '—'}</span>
          </div>
          <div class="meta">${d.cidade || '—'}<span class="dot">·</span>${d.motorista || '—'}</div>
          <span class="status ${statusClass(d.status)}">${d.status || '—'}</span>
          ${semEndereco ? '<div class="noaddr">Sem coordenadas — geocodifique o endereço</div>' : ''}
        </div>`;
    }).join('');
  }

  entregasAtuais.forEach((d, i) => {
    if (d.cidade) cidades.add(d.cidade);
    if (d.lat == null || d.lng == null){ semGeo++; return; }

    const numeroRota = rotaSugerida ? rotaSugerida.indexOf(d.linha) + 1 : 0;
    const icone = numeroRota > 0 ? pinIconNumerado_(numeroRota, d.periodo) : pinIcon(d.periodo);
    const marker = L.marker([d.lat, d.lng], { icon: icone });
    marker.bindTooltip(escapeAttr_(d.cliente), {
      permanent: true, direction: 'top', offset: [0, -24], className: 'rotulo-cliente'
    });
    marker.bindPopup(`
      <div class="pop">
        <h3>${numeroRota > 0 ? '#' + numeroRota + ' · ' : ''}${d.cliente}</h3>
        <div class="row"><b>Endereço:</b> ${d.endereco}</div>
        <div class="row"><b>Motorista:</b> ${d.motorista || '—'}</div>
        <div class="row"><b>Data:</b> ${formatarDataBR_(d.data) || '—'} · ${d.periodo || '—'}</div>
        ${d.observacoes ? `<div class="row"><b>Obs:</b> ${d.observacoes}</div>` : ''}
        <span class="status ${statusClass(d.status)}">${d.status || '—'}</span>
      </div>
    `);
    (d.periodo === 'TARDE' ? clusterTarde : clusterManha).addLayer(marker);
    markersById[i] = marker;
    bounds.push([d.lat, d.lng]);
  });

  document.getElementById('statTotal').textContent = entregasAtuais.length;
  document.getElementById('statCidades').textContent = cidades.size;
  document.getElementById('statSemGeo').textContent = semGeo;

  // desenha (ou apaga) a rota sugerida: usa o caminho real pelas ruas
  // (geometria do OpenRouteService) quando disponível; se não vier por
  // algum motivo, cai pra linha reta entre os pontos como alternativa.
  if (rotaLinha){ map.removeLayer(rotaLinha); rotaLinha = null; }
  if (rotaSetas){ map.removeLayer(rotaSetas); rotaSetas = null; }

  if (rotaSugerida && rotaOrigem){
    let pontosRota;
    if (rotaGeometria){
      pontosRota = decodificarPolyline_(rotaGeometria);
    } else {
      pontosRota = [[rotaOrigem.lat, rotaOrigem.lng]];
      rotaSugerida.forEach(linha => {
        const item = entregasAtuais.find(d => d.linha === linha);
        if (item) pontosRota.push([item.lat, item.lng]);
      });
      pontosRota.push([rotaOrigem.lat, rotaOrigem.lng]);
    }
    rotaLinha = L.polyline(pontosRota, { color:'#2f93a3', weight:4, opacity:.85 }).addTo(map);

    // setas de direção ao longo da linha, mostrando o sentido do percurso
    if (typeof L.polylineDecorator === 'function'){
      rotaSetas = L.polylineDecorator(rotaLinha, {
        patterns: [{
          offset: '4%', repeat: '7%',
          symbol: L.Symbol.arrowHead({
            pixelSize: 9, polygon: true,
            pathOptions: { color: '#1a5a63', fillColor: '#1a5a63', fillOpacity: 1, weight: 0 }
          })
        }]
      }).addTo(map);
    }
  }

  if (ajustarZoom && bounds.length){
    map.fitBounds(bounds, { padding:[40,40], maxZoom:13 });
  }
}

/* ===== SUGESTÃO DE ROTA (OpenRouteService) ===== */

async function sugerirRota(){
  const pontos = entregasAtuais
    .filter(d => d.ok === true && d.lat != null && d.lng != null)
    .map(d => ({ linha: d.linha, lat: d.lat, lng: d.lng }));

  if (!pontos.length){
    mostrarToast('Nenhuma entrega com "OK" marcado nesse filtro.', true);
    return;
  }
  if (!API_URL){
    mostrarToast('Configure a API_URL no início do arquivo.', true);
    return;
  }

  mostrarToast('Calculando a melhor rota…');

  try{
    const res = await chamarAPI_POST_({ acao: 'sugerirRota', pontos: pontos });
    if (!res.ok){
      mostrarToast('Erro: ' + res.erro, true);
      return;
    }
    rotaSugerida = res.ordem;
    rotaOrigem = res.origem;
    rotaGeometria = res.geometria || null;
    document.getElementById('btnLimparRota').style.display = 'inline-block';
    const painel = document.getElementById('rotaInfo');
    painel.style.display = 'flex';
    painel.innerHTML = '<span>📏 ' + res.distanciaKm + ' km</span><span>⏱ ~' + res.duracaoMin + ' min</span>';
    mostrarToast('Rota sugerida!');
    if (modoAtual === 'tabela') renderTabela(); else render(false);
  }catch(err){
    mostrarToast('Erro: ' + err, true);
  }
}

function limparRotaSugerida(){
  rotaSugerida = null;
  rotaOrigem = null;
  rotaGeometria = null;
  document.getElementById('btnLimparRota').style.display = 'none';
  document.getElementById('rotaInfo').style.display = 'none';
  if (modoAtual === 'tabela') renderTabela(); else render(false);
}

/* ===== CONFIRMAÇÕES DO MOTORISTA =====
   O motorista marca "entregue"/"não entregue" no celular dele
   (Motorista.html), mas isso só fica registrado numa aba separada — o
   status de verdade na HISTORICO_ENTREGAS só muda quando a Viviane revisa
   e confirma aqui, individualmente ou tudo de uma vez. */
let confirmacoesPendentes = [];

async function carregarConfirmacoesPendentes(){
  if (!API_URL) return;
  try{
    const lista = await chamarAPI_GET_({ formato: 'confirmacoesPendentes' });
    confirmacoesPendentes = Array.isArray(lista) ? lista : [];
    atualizarBadgeConfirmacoes_();
  }catch(err){
    // segue sem atualizar — não interrompe o resto do mapa
  }
}

function atualizarBadgeConfirmacoes_(){
  const btn = document.getElementById('btnConfirmacoes');
  const n = confirmacoesPendentes.length;
  btn.textContent = '🚚 Confirmações do motorista' + (n > 0 ? ' (' + n + ')' : '');
  btn.classList.toggle('tem-pendentes', n > 0);
}

function abrirModalConfirmacoes(){
  renderListaConfirmacoes_();
  document.getElementById('modalConfirmacoes').classList.add('show');
}

function fecharModalConfirmacoes(){
  document.getElementById('modalConfirmacoes').classList.remove('show');
}

function renderListaConfirmacoes_(){
  const container = document.getElementById('listaConfirmacoes');
  const btnTodas = document.getElementById('btnConfirmarTodas');

  if (!confirmacoesPendentes.length){
    container.innerHTML = '<div class="busca-resultado" style="display:block;">Nenhuma confirmação pendente no momento.</div>';
    btnTodas.disabled = true;
    return;
  }
  btnTodas.disabled = false;

  container.innerHTML = confirmacoesPendentes.map(function(c){
    const marcadoEntregue = c.statusMarcado === 'ENTREGUE';
    const rotulo = marcadoEntregue ? '✅ Entregue' : '❌ Não entregue';
    const cor = marcadoEntregue ? 'var(--entregue)' : 'var(--fila)';
    return '<div class="confirmacao-item">' +
      '<div class="info"><b>' + c.cliente + '</b>' +
      '<small style="color:' + cor + ';">' + rotulo + ' · ' + (c.motorista || '') + '</small></div>' +
      '<button class="btn-secondary" onclick="confirmarUma(' + c.linha + ')">✓ Confirmar</button>' +
      '</div>';
  }).join('');
}

async function confirmarUma(linha){
  try{
    const res = await chamarAPI_POST_({ acao: 'confirmarEntrega', linha: linha });
    if (!res.ok){ mostrarToast('Erro: ' + res.erro, true); return; }
    mostrarToast('Confirmado!');
    await carregarConfirmacoesPendentes();
    renderListaConfirmacoes_();
    carregarEntregas();
  }catch(err){
    mostrarToast('Erro: ' + err, true);
  }
}

async function confirmarTodasPendentes(){
  if (!confirmacoesPendentes.length) return;
  if (!confirm('Confirmar todas as ' + confirmacoesPendentes.length + ' entrega(s) marcadas pelo motorista?')) return;

  try{
    const res = await chamarAPI_POST_({ acao: 'confirmarTodas' });
    if (!res.ok){ mostrarToast('Erro: ' + res.erro, true); return; }
    mostrarToast((res.total || 0) + ' confirmada(s)!');
    fecharModalConfirmacoes();
    await carregarConfirmacoesPendentes();
    carregarEntregas();
  }catch(err){
    mostrarToast('Erro: ' + err, true);
  }
}

function escapeAttr_(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* Mesma lógica das regras de formatação condicional da HISTORICO_ENTREGAS,
   na mesma ordem de prioridade (a primeira que bater "ganha"). */
// Cores reais lidas da formatação condicional da sua planilha (via
// carregarCoresStatus_) — os hex abaixo só entram como reserva, se por
// algum motivo a leitura falhar.
let coresStatus = {};

async function carregarCoresStatus_(){
  if (!API_URL) return;
  try{
    const cores = await chamarAPI_GET_({ formato: 'coresStatus' });
    coresStatus = (cores && typeof cores === 'object') ? cores : {};
  }catch(err){
    // segue com as cores de reserva
  }
}

function corLinhaEntrega_(d){
  const status = String(d.status || '').trim().toUpperCase();
  const cor = function(chave, reserva){ return coresStatus[chave] || reserva; };

  if (status === 'CANCELAR') return cor('CANCELAR', '#f4cccc');
  if (status === 'ENTREGUE') return cor('ENTREGUE', '#d9ead3');
  if (d.ok === true) return cor('OK', '#cfe2f3');
  if (status === 'EM ANDAMENTO') return cor('EM ANDAMENTO', '#fff2cc'); // amarelinho
  if (status === 'EM FILA') return cor('EM FILA', '#e0c3e8'); // rosa puxado pro roxo
  if (!status && d.data) return cor('ATENCAO', '#ea9999'); // sem status mas com data prevista — precisa de atenção
  return '';
}

// Cor da FONTE da linha, combinando com o fundo — segue a mesma prioridade
// de corLinhaEntrega_ pra sempre bater com a cor de fundo escolhida.
function corTextoLinhaEntrega_(d){
  const status = String(d.status || '').trim().toUpperCase();
  if (status === 'ENTREGUE') return '#0c343d';       // fundo verde
  if (d.ok === true) return '#1c4587';                // fundo azul
  if (status === 'EM ANDAMENTO') return '#7f6000';    // fundo amarelo
  if (status === 'EM FILA') return '#4c1130';         // fundo rosa
  return '';
}

const TABELA_PORCENTAGEM_CHAVE = 'mapaTabelaLarguraPorcentagem';
let tabelaCondensada = localStorage.getItem(TABELA_CONDENSADA_CHAVE) === '1';
let larguraEmPorcentagem = localStorage.getItem(TABELA_PORCENTAGEM_CHAVE) === '1';

function alternarCondensada_(){
  tabelaCondensada = !tabelaCondensada;
  try{ localStorage.setItem(TABELA_CONDENSADA_CHAVE, tabelaCondensada ? '1' : '0'); }catch(e){}
  renderTabela();
}

function alternarLarguraPorcentagem_(){
  larguraEmPorcentagem = !larguraEmPorcentagem;
  try{ localStorage.setItem(TABELA_PORCENTAGEM_CHAVE, larguraEmPorcentagem ? '1' : '0'); }catch(e){}
  renderTabela();
}

function estiloLarguraCol_(chave, padrao){
  const largura = larguraColunas[chave] || padrao;
  return largura ? ' style="width:' + largura + 'px;"' : '';
}

function handleResize_(chave){
  return '<span class="col-resize-handle" onmousedown="iniciarResizeColuna_(event,\'' + chave + '\')" ' +
    'ontouchstart="iniciarResizeColuna_(event,\'' + chave + '\')" onclick="event.stopPropagation()"></span>';
}

function iniciarResizeColuna_(e, chave){
  e.preventDefault();
  e.stopPropagation();
  const th = e.target.closest('th');
  const handle = e.target;
  handle.classList.add('resizando');

  const pontoInicial = (e.touches && e.touches[0]) ? e.touches[0] : e;
  const startX = pontoInicial.clientX;
  const startWidth = th.offsetWidth;

  function mover(ev){
    const ponto = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const novaLargura = Math.max(36, startWidth + (ponto.clientX - startX));
    th.style.width = novaLargura + 'px';
    larguraColunas[chave] = novaLargura;
  }
  function soltar(){
    handle.classList.remove('resizando');
    document.removeEventListener('mousemove', mover);
    document.removeEventListener('mouseup', soltar);
    document.removeEventListener('touchmove', mover);
    document.removeEventListener('touchend', soltar);
    try{ localStorage.setItem(LARGURA_COLUNAS_CHAVE, JSON.stringify(larguraColunas)); }catch(err){}
  }
  document.addEventListener('mousemove', mover);
  document.addEventListener('mouseup', soltar);
  document.addEventListener('touchmove', mover, { passive:false });
  document.addEventListener('touchend', soltar);
}

let ordenacaoData = null; // null | 'asc' | 'desc'
let filtroPopupAberto = false;

/* ----- preferências da tabela (ordenação, filtro de status/período) —
   sobrevivem a um F5 / fechar e abrir o navegador de novo ----- */
const TABELA_PREFS_CHAVE = 'mapaTabelaPrefs';
function salvarPrefsTabela_(){
  try{
    localStorage.setItem(TABELA_PREFS_CHAVE, JSON.stringify({
      ordenacaoData: ordenacaoData,
      filtroPeriodoTabela: filtroPeriodoTabela,
      filtroStatusTabela: Array.from(filtroStatusTabela)
    }));
  }catch(e){}
}
(function carregarPrefsTabela_(){
  try{
    const salvo = JSON.parse(localStorage.getItem(TABELA_PREFS_CHAVE) || '{}');
    if (salvo.ordenacaoData === 'asc' || salvo.ordenacaoData === 'desc') ordenacaoData = salvo.ordenacaoData;
    if (typeof salvo.filtroPeriodoTabela === 'string') filtroPeriodoTabela = salvo.filtroPeriodoTabela;
    if (Array.isArray(salvo.filtroStatusTabela)) filtroStatusTabela = new Set(salvo.filtroStatusTabela);
  }catch(e){}
})();

function prioridadeStatus_(status){
  const s = String(status || '').trim().toUpperCase();
  if (s === 'ENTREGUE') return 0;
  if (s === 'EM ANDAMENTO') return 1;
  if (s === 'EM FILA') return 2;
  if (s === 'CANCELAR') return 3;
  return 99; // vazio ou outros valores — sempre por último
}

function alternarFiltroStatusPopup_(e){
  e.stopPropagation();
  filtroPopupAberto = !filtroPopupAberto;
  const popup = document.getElementById('filtroStatusPopup');
  if (popup){
    popup.classList.toggle('aberto', filtroPopupAberto);
    if (filtroPopupAberto) reposicionarPopupStatus_(e.target);
  }
}

// Calcula a posição do popup na hora, baseado em onde o botão ▾ está na
// TELA (não na tabela) — assim ele nunca fica preso/cortado quando a
// tabela rola de lado, independente de sticky/scroll.
function reposicionarPopupStatus_(botao){
  const popup = document.getElementById('filtroStatusPopup');
  if (!popup || !botao) return;
  const rect = botao.getBoundingClientRect();
  popup.style.top = (rect.bottom + 4) + 'px';
  popup.style.left = Math.max(4, rect.left - 90) + 'px'; // centraliza mais ou menos sob o botão
}

function alternarStatusNoFiltro_(valor, marcado){
  if (marcado) filtroStatusTabela.add(valor); else filtroStatusTabela.delete(valor);
  salvarPrefsTabela_();
  renderTabela();
  if (filtroPopupAberto){
    const btn = document.querySelector('.th-filtro-btn');
    if (btn) reposicionarPopupStatus_(btn);
  }
}

function alternarOrdenacaoData_(){
  // Se tinha uma rota sugerida ativa de antes, ela sempre tem prioridade
  // sobre a ordenação por data — e ficava "grudada" mesmo depois de bem
  // depois, fazendo parecer que ordenar por Data tinha "parado de
  // funcionar". Clicar em Data é um pedido explícito de ordenar por data,
  // então limpa a rota antiga primeiro.
  if (rotaSugerida){
    rotaSugerida = null;
    rotaOrigem = null;
    rotaGeometria = null;
    const btnLimpar = document.getElementById('btnLimparRota');
    const infoRota = document.getElementById('rotaInfo');
    if (btnLimpar) btnLimpar.style.display = 'none';
    if (infoRota) infoRota.style.display = 'none';
  }
  ordenacaoData = ordenacaoData === null ? 'asc' : (ordenacaoData === 'asc' ? 'desc' : null);
  salvarPrefsTabela_();
  renderTabela();
}

function renderTabela(ehAtualizacaoAutomatica){
  const container = document.getElementById('tabelaContainer');

  // se for uma atualização automática (a cada 20s) e a pessoa estiver com
  // o cursor em algum campo da tabela editando, pula essa rodada — evita
  // apagar/resetar o que ela está digitando no meio da edição
  if (ehAtualizacaoAutomatica && container && document.activeElement && container.contains(document.activeElement)){
    return;
  }

  // filtros próprios da tabela — status e período — totalmente
  // independentes do sidebar (que só afeta o mapa)
  let lista = entregasParaTabela.filter(d => {
    const chave = String(d.status || '').trim().toUpperCase() || 'VAZIO';
    if (!filtroStatusTabela.has(chave)) return false;
    if (filtroPeriodoTabela && d.periodo !== filtroPeriodoTabela) return false;
    return true;
  });

  if (!lista.length){
    container.innerHTML = '<div class="empty"><div class="big">📭</div>Nenhuma entrega encontrada<br>pra esses filtros.</div>';
    return;
  }

  // ordem: rota sugerida (se tiver) > ordenação manual de data (se ativada)
  // > padrão: Entregue, depois Em andamento, depois Em fila, vazio por último
  if (rotaSugerida){
    lista = lista.slice().sort((a, b) => {
      const ia = rotaSugerida.indexOf(a.linha);
      const ib = rotaSugerida.indexOf(b.linha);
      return (ia === -1 ? 9999 : ia) - (ib === -1 ? 9999 : ib);
    });
  } else if (ordenacaoData){
    lista = lista.slice().sort((a, b) => {
      const da = a.data || '';
      const db = b.data || '';
      if (!da && !db) return 0;
      if (!da) return 1;  // sem data sempre por último, nas duas direções
      if (!db) return -1;
      return ordenacaoData === 'asc' ? da.localeCompare(db) : db.localeCompare(da);
    });
  } else {
    lista = lista.slice().sort((a, b) => prioridadeStatus_(a.status) - prioridadeStatus_(b.status));
  }

  const opcoesMotorista = motoristasDisponiveis.map(m => `<option value="${escapeAttr_(m)}">${m}</option>`).join('');
  const setaData = ordenacaoData === 'asc' ? '▲' : (ordenacaoData === 'desc' ? '▼' : '↕');

  const checkStatus = (valor) => filtroStatusTabela.has(valor) ? ' checked' : '';
  const ativoPeriodoTabela = (valor) => filtroPeriodoTabela === valor ? ' active' : '';

  let html = '<div class="tabela-toolbar">' +
      '<span class="contagem">' + lista.length + ' de ' + entregasParaTabela.length + ' entrega(s)</span>' +
      '<div class="tabela-controles">' +
        '<div class="periodo-tabela">' +
          '<button type="button" class="' + (filtroPeriodoTabela === '' ? 'active' : '') + '" onclick="definirPeriodoTabela_(\'\')">Todos</button>' +
          '<button type="button" class="' + ativoPeriodoTabela('MANHÃ') + '" onclick="definirPeriodoTabela_(\'MANHÃ\')">Manhã</button>' +
          '<button type="button" class="' + ativoPeriodoTabela('TARDE') + '" onclick="definirPeriodoTabela_(\'TARDE\')">Tarde</button>' +
        '</div>' +
        '<button type="button" class="btn-toggle-tabela' + (tabelaCondensada ? ' active' : '') + '" onclick="alternarCondensada_()">↕ Condensada</button>' +
        '<button type="button" class="btn-toggle-tabela' + (larguraEmPorcentagem ? ' active' : '') + '" onclick="alternarLarguraPorcentagem_()" title="' + (larguraEmPorcentagem ? 'Largura fixa: colunas mantêm o tamanho, a tabela rola de lado se não couber' : 'Ajustar à tela: encolhe as colunas proporcionalmente pra caber tudo sem rolar de lado') + '">' + (larguraEmPorcentagem ? '🔒 Largura fixa' : '↔ Ajustar à tela') + '</button>' +
      '</div>' +
      '<div class="legenda">' +
        '<span><i style="background:' + (coresStatus['ENTREGUE']||'#d9ead3') + '"></i>Entregue</span>' +
        '<span><i style="background:' + (coresStatus['OK']||'#cfe2f3') + '"></i>Pedido pronto</span>' +
        '<span><i style="background:' + (coresStatus['EM ANDAMENTO']||'#fff2cc') + '"></i>Em andamento</span>' +
        '<span><i style="background:' + (coresStatus['EM FILA']||'#e0c3e8') + '"></i>Em fila</span>' +
        '<span><i style="background:' + (coresStatus['ATENCAO']||'#ea9999') + '"></i>Atenção</span>' +
      '</div>' +
    '</div>' +
    '<table class="tabela-entregas' + (tabelaCondensada ? ' condensada' : '') + (larguraEmPorcentagem ? ' largura-percentual' : '') + '"><thead><tr>' +
    (rotaSugerida ? '<th' + estiloLarguraCol_('numero', 40) + '>#' + handleResize_('numero') + '</th>' : '') +
    '<th' + estiloLarguraCol_('codigo', 70) + '>Código' + handleResize_('codigo') + '</th>' +
    '<th' + estiloLarguraCol_('cliente', 150) + '>Cliente' + handleResize_('cliente') + '</th>' +
    '<th' + estiloLarguraCol_('repr', 70) + '>Repr.' + handleResize_('repr') + '</th>' +
    '<th' + estiloLarguraCol_('endereco', 220) + '>Endereço' + handleResize_('endereco') + '</th>' +
    '<th' + estiloLarguraCol_('cidade', 110) + '>Cidade' + handleResize_('cidade') + '</th>' +
    '<th' + estiloLarguraCol_('motorista', 110) + '>Motorista' + handleResize_('motorista') + '</th>' +
    '<th class="th-ordenavel"' + estiloLarguraCol_('data', 110) + ' onclick="alternarOrdenacaoData_()">Data <span>' + setaData + '</span>' + handleResize_('data') + '</th>' +
    '<th' + estiloLarguraCol_('periodo', 90) + '>Período' + handleResize_('periodo') + '</th>' +
    '<th class="th-status"' + estiloLarguraCol_('status', 120) + '>' +
      '<span class="th-status-linha">Status' +
        '<button type="button" class="th-filtro-btn" onclick="alternarFiltroStatusPopup_(event)">▾</button>' +
      '</span>' +
      '<div class="th-filtro-popup' + (filtroPopupAberto ? ' aberto' : '') + '" id="filtroStatusPopup">' +
        '<label><input type="checkbox"' + checkStatus('ENTREGUE') + ' onchange="alternarStatusNoFiltro_(\'ENTREGUE\', this.checked)"> Entregue</label>' +
        '<label><input type="checkbox"' + checkStatus('EM ANDAMENTO') + ' onchange="alternarStatusNoFiltro_(\'EM ANDAMENTO\', this.checked)"> Em andamento</label>' +
        '<label><input type="checkbox"' + checkStatus('EM FILA') + ' onchange="alternarStatusNoFiltro_(\'EM FILA\', this.checked)"> Em fila</label>' +
      '</div>' +
      handleResize_('status') +
    '</th>' +
    '<th' + estiloLarguraCol_('ok', 46) + '>OK</th>' +
    '<th' + estiloLarguraCol_('obs', 170) + '>Observações' + handleResize_('obs') + '</th>' +
    '<th style="width:32px;"></th>' +
    '</tr></thead><tbody>';

  lista.forEach(d => {
    const corLinha = corLinhaEntrega_(d);
    const corTexto = corTextoLinhaEntrega_(d);
    const estiloLinha = (corLinha || corTexto)
      ? ' style="' + (corLinha ? 'background:' + corLinha + ';' : '') + (corTexto ? 'color:' + corTexto + ';' : '') + '"'
      : '';
    const numeroRota = rotaSugerida ? rotaSugerida.indexOf(d.linha) + 1 : 0;
    html += '<tr data-linha="' + d.linha + '"' + estiloLinha + '>' +
      (rotaSugerida ? '<td style="text-align:center;font-weight:700;">' + (numeroRota > 0 ? numeroRota : '—') + '</td>' : '') +
      '<td><input type="text" class="td-input" data-campo="codigo" value="' + escapeAttr_(d.codigo) + '" style="width:70px;"></td>' +
      '<td class="td-cliente">' + d.cliente + '</td>' +
      '<td><input type="text" class="td-input" data-campo="representante" value="' + escapeAttr_(d.representante) + '" style="width:70px;"></td>' +
      '<td><input type="text" class="td-input" data-campo="endereco" value="' + escapeAttr_(d.endereco) + '"></td>' +
      '<td class="td-cidade">' + (d.cidade || '—') + '</td>' +
      '<td><select class="td-input" data-campo="motorista"><option value="">—</option>' + opcoesMotorista + '</select></td>' +
      '<td><input type="date" class="td-input td-data" data-campo="data" value="' + (d.data || '') + '"></td>' +
      '<td><select class="td-input" data-campo="periodo"><option value="">—</option><option value="MANHÃ">MANHÃ</option><option value="TARDE">TARDE</option></select></td>' +
      '<td><select class="td-input td-status-select" data-campo="status"><option value="EM FILA">EM FILA</option><option value="EM ANDAMENTO">EM ANDAMENTO</option><option value="ENTREGUE">ENTREGUE</option><option value="CANCELAR">CANCELAR</option></select></td>' +
      '<td class="td-check"><input type="checkbox" class="td-checkbox" data-campo="ok"' + (d.ok ? ' checked' : '') + '></td>' +
      '<td><input type="text" class="td-input" data-campo="observacoes" value="' + escapeAttr_(d.observacoes) + '"></td>' +
      '<td class="td-remover"><button type="button" class="btn-remover" title="Remover entrega" onclick="removerLinha_(this)">🗑</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;

  // seleciona o valor atual nos <select> (não dá pra fazer isso via string HTML)
  const linhasDom = container.querySelectorAll('tbody tr');
  linhasDom.forEach((tr, i) => {
    const d = lista[i];
    tr.querySelector('[data-campo="motorista"]').value = d.motorista || '';
    tr.querySelector('[data-campo="periodo"]').value = d.periodo || '';
    tr.querySelector('[data-campo="status"]').value = d.status || '';
  });

  container.querySelectorAll('[data-campo="codigo"]').forEach(el => {
    el.addEventListener('change', onEditarCodigo_);
  });
  container.querySelectorAll('.td-input:not([data-campo="codigo"])').forEach(el => {
    el.addEventListener('change', onEditarCelula_);
  });
  container.querySelectorAll('.td-checkbox').forEach(el => {
    el.addEventListener('change', onEditarCelula_);
  });
}

async function onEditarCelula_(e){
  const el = e.target;
  const tr = el.closest('tr');
  const linha = tr.getAttribute('data-linha');
  const campo = el.getAttribute('data-campo');
  const valor = (el.type === 'checkbox') ? el.checked : el.value;

  if (!API_URL){
    mostrarToast('Configure a API_URL no início do arquivo.', true);
    return;
  }

  el.classList.add('salvando');
  el.classList.remove('erro-salvar');

  try{
    const res = await chamarAPI_POST_({ acao: 'atualizarCampo', linha: linha, campo: campo, valor: valor });
    el.classList.remove('salvando');
    if (!res.ok){
      el.classList.add('erro-salvar');
      mostrarToast('Erro ao salvar: ' + res.erro, true);
      return;
    }
    // atualiza em memória (nos dois arrays) sem precisar recarregar tudo
    const item = todasEntregas.find(d => String(d.linha) === String(linha));
    if (item) item[campo] = valor;
    const item2 = entregasAtuais.find(d => String(d.linha) === String(linha));
    if (item2) item2[campo] = valor;
    mostrarToast('Salvo!');
  }catch(err){
    el.classList.remove('salvando');
    el.classList.add('erro-salvar');
    mostrarToast('Erro: ' + err, true);
  }
}

/* Editar o CÓDIGO do cliente é diferente: busca de novo o cliente (mesma
   lógica do "+ Nova entrega") e já atualiza Cliente/Repr. na tela. */
async function onEditarCodigo_(e){
  const el = e.target;
  const tr = el.closest('tr');
  const linha = tr.getAttribute('data-linha');
  const novoCodigo = el.value.trim();

  if (!API_URL){
    mostrarToast('Configure a API_URL no início do arquivo.', true);
    return;
  }

  el.classList.add('salvando');
  el.classList.remove('erro-salvar');

  try{
    const res = await chamarAPI_POST_({ acao: 'atualizarCodigo', linha: linha, novoCodigo: novoCodigo });
    el.classList.remove('salvando');
    if (!res.ok){
      el.classList.add('erro-salvar');
      mostrarToast('Erro: ' + res.erro, true);
      return;
    }
    // atualiza cliente + representante na tela e em memória, sem recarregar tudo
    tr.querySelector('.td-cliente').textContent = res.fantasia;
    tr.querySelector('[data-campo="representante"]').value = res.representante || '';

    [todasEntregas, entregasAtuais].forEach(arr => {
      const item = arr.find(d => String(d.linha) === String(linha));
      if (item){
        item.codigo = res.codigo;
        item.cliente = res.fantasia;
        item.representante = res.representante || '';
      }
    });
    mostrarToast('Cliente atualizado: ' + res.fantasia);
  }catch(err){
    el.classList.remove('salvando');
    el.classList.add('erro-salvar');
    mostrarToast('Erro: ' + err, true);
  }
}

/* Remove a entrega inteira. Como apagar uma linha muda o número de linha de
   tudo que vem depois dela na planilha, recarrega os dados do zero em
   seguida — mais simples e seguro que tentar corrigir os números na mão. */
async function removerLinha_(botao){
  const tr = botao.closest('tr');
  const linha = tr.getAttribute('data-linha');
  const nomeCliente = tr.querySelector('.td-cliente').textContent;

  if (!confirm('Remover a entrega de "' + nomeCliente + '"? Essa ação não pode ser desfeita.')) return;

  if (!API_URL){
    mostrarToast('Configure a API_URL no início do arquivo.', true);
    return;
  }

  botao.disabled = true;

  try{
    const res = await chamarAPI_POST_({ acao: 'removerEntrega', linha: linha });
    if (!res.ok){
      botao.disabled = false;
      mostrarToast('Erro ao remover: ' + res.erro, true);
      return;
    }
    mostrarToast('Entrega removida.');
    todasEntregas = []; // força recarregar do zero (os números de linha mudaram)
    carregarEntregas();
  }catch(err){
    botao.disabled = false;
    mostrarToast('Erro: ' + err, true);
  }
}

function focarEntrega(i){
  document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.item[data-idx="${i}"]`);
  if (el) el.classList.add('active');

  const marker = markersById[i];
  if (!marker) return;
  const ll = marker.getLatLng();
  map.setView(ll, 15, { animate:true });
  // abre o popup mesmo estando dentro de um cluster
  const parent = clusterManha.getVisibleParent(marker) || clusterTarde.getVisibleParent(marker);
  if (parent && parent !== marker){
    clusterManha.zoomToShowLayer(marker, () => marker.openPopup());
    clusterTarde.zoomToShowLayer(marker, () => marker.openPopup());
  } else {
    marker.openPopup();
  }
}

async function carregarMotoristas(){
  if (!API_URL) return;
  try{
    const lista = await chamarAPI_GET_({ formato: 'motoristas' });
    motoristasDisponiveis = Array.isArray(lista) ? lista : [];
    popularSelectMotoristas_();
  }catch(err){
    // segue sem a lista, campo fica só com "Selecione..."
  }
}

function popularSelectMotoristas_(){
  const sel = document.getElementById('novoMotorista');
  const atual = sel.value;
  sel.innerHTML = '<option value="">Selecione...</option>' +
    motoristasDisponiveis.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.value = atual;
}

function abrirModal(){
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('novoCodigo').value = '';
  document.getElementById('novoCep').value = '';
  document.getElementById('novaRua').value = '';
  document.getElementById('novoNumero').value = '';
  document.getElementById('novoBairro').value = '';
  document.getElementById('novaCidade').value = '';
  document.getElementById('novoUf').value = '';
  enderecoAplicado = '';
  coordsAjustadasManualmente = null;
  document.getElementById('novoMotorista').value = '';
  document.getElementById('novaObs').value = '';

  document.getElementById('buscaResultado').className = 'busca-resultado';
  document.getElementById('buscaResultado').textContent = '';
  document.getElementById('enderecoResultado').className = 'busca-resultado';
