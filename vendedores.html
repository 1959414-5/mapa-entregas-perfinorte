<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Entregas — Vendedores · Perfinorte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --ink:#12161b; --panel:#181d24; --panel-2:#1f2530; --line:#2a313c;
    --paper:#eef1f4; --paper-dim:#aab3bf;
    --manha:#e8a23d; --tarde:#2f93a3; --entregue:#5fae72; --fila:#d8622f;
    --font-ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-ui);}
  #app{display:grid;grid-template-columns:300px 1fr 280px;height:100vh;transition:grid-template-columns .18s ease;}
  #app.sidebar-colapsado{grid-template-columns:0px 1fr 280px;}
  #app.sidebar-direito-colapsado{grid-template-columns:300px 1fr 0px;}
  #app.sidebar-colapsado.sidebar-direito-colapsado{grid-template-columns:0px 1fr 0px;}
  #app.tabela-ativa{grid-template-columns:300px 1fr 0px;}
  #app.tabela-ativa.sidebar-colapsado{grid-template-columns:0px 1fr 0px;}

  #sidebar{background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; min-width:0;}
  #sidebar > *{min-width:300px;}
  #sidebarToggle{
    position:fixed; top:50%; left:300px; transform:translateY(-50%);
    width:22px; height:44px; margin-left:-1px; background:var(--panel); border:1px solid var(--line);
    color:var(--paper-dim); cursor:pointer; border-radius:0 6px 6px 0;
    display:flex; align-items:center; justify-content:center; z-index:1500; font-size:12px;
    transition:left .18s ease;
  }
  #app.sidebar-colapsado #sidebarToggle{left:0;}

  #sidebarDireito{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; min-width:0;}
  #sidebarDireito > *{min-width:280px;}
  #sidebarDireitoToggle{
    position:fixed; top:50%; right:280px; transform:translateY(-50%);
    width:22px; height:44px; margin-right:-1px; background:var(--panel); border:1px solid var(--line);
    color:var(--paper-dim); cursor:pointer; border-radius:6px 0 0 6px;
    display:flex; align-items:center; justify-content:center; z-index:1500; font-size:12px;
    transition:right .18s ease;
  }
  #app.sidebar-direito-colapsado #sidebarDireitoToggle{right:0;}

  .brand{padding:18px 20px 14px; border-bottom:1px solid var(--line);}
  .brand .eyebrow{font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; color:var(--paper-dim); text-transform:uppercase;}
  .brand h1{margin:4px 0 0; font-size:17px; font-weight:700;}
  .brand .tag-somente-ver{
    display:inline-block; margin-top:8px; padding:3px 9px; border-radius:20px;
    background:rgba(232,162,61,.15); color:var(--manha); font-size:10px;
    font-family:var(--font-mono); letter-spacing:.05em; text-transform:uppercase;
  }
  .view-toggle{display:flex; gap:6px; margin-top:10px;}
  .view-toggle button{
    flex:1; padding:7px 6px; border-radius:4px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; cursor:pointer;
  }
  .view-toggle button.active{background:var(--paper); color:var(--ink); border-color:var(--paper);}

  .controls{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:12px;}
  .field label{display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:5px;}
  .field select, .field input[type=date]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--paper);
    padding:8px 10px; border-radius:4px; font-size:13px; font-family:var(--font-ui);
  }
  .date-range{display:flex; align-items:center; gap:6px;}
  .date-range input{flex:1; min-width:0;}
  .date-range-sep{color:var(--paper-dim); font-size:11px; flex-shrink:0;}
  .date-atalhos{display:flex; gap:6px; margin-top:6px;}
  .date-atalhos button{
    flex:1; padding:5px 6px; border-radius:4px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim); font-family:var(--font-mono); font-size:10px; cursor:pointer;
  }
  .period-toggle{display:flex; gap:6px;}
  .period-toggle button{
    flex:1; padding:8px 6px; border-radius:4px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim); font-family:var(--font-mono); font-size:11px; cursor:pointer;
  }
  .period-toggle button.active[data-p="MANHÃ"]{background:var(--manha);color:#1a1305;border-color:var(--manha);}
  .period-toggle button.active[data-p="TARDE"]{background:var(--tarde);color:#04191c;border-color:var(--tarde);}
  .period-toggle button.active[data-p=""]{background:var(--paper);color:var(--ink);border-color:var(--paper);}
  .period-toggle button.active[data-ok=""]{background:var(--paper);color:var(--ink);border-color:var(--paper);}
  .period-toggle button.active[data-ok="sim"]{background:var(--entregue);color:#0c2e13;border-color:var(--entregue);}
  .period-toggle button.active[data-ok="nao"]{background:var(--fila);color:#3a1600;border-color:var(--fila);}

  .status-filtro-sidebar{display:flex; flex-direction:column; gap:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:8px 10px;}
  .status-filtro-sidebar label{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--paper); cursor:pointer;}
  .status-filtro-sidebar input[type=checkbox]{accent-color:var(--manha); width:14px; height:14px; cursor:pointer;}

  .summary{padding:14px 20px; display:flex; gap:10px; border-bottom:1px solid var(--line);}
  .summary .stat{flex:1; text-align:left;}
  .summary .stat .n{font-family:var(--font-mono); font-size:20px; font-weight:700;}
  .summary .stat .l{font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--paper-dim); margin-top:2px;}
  .summary .stat.geo-warn .n{color:var(--fila);}

  #list{flex:1; overflow-y:auto; padding:6px 0;}
  .item{padding:10px 20px; border-bottom:1px solid var(--line); cursor:pointer;}
  .item:hover{background:var(--panel-2);}
  .item .top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .item .cliente{font-weight:600; font-size:13px;}
  .item .badge{font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; padding:2px 6px; border-radius:3px; white-space:nowrap;}
  .badge.MANHÃ{background:rgba(232,162,61,.16); color:var(--manha);}
  .badge.TARDE{background:rgba(47,147,163,.16); color:var(--tarde);}
  .item .meta{margin-top:3px; font-size:11px; color:var(--paper-dim);}
  .item .meta .dot{margin:0 5px; opacity:.5;}
  .item .status{display:inline-block; margin-top:5px; font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;}
  .empty, .loading{padding:40px 20px; text-align:center; color:var(--paper-dim); font-size:13px;}
  .empty .big, .loading .big{font-size:26px; margin-bottom:8px;}

  #map{height:100vh; background:#f2efe9;}
  .leaflet-tile-container{transform:scale(1.0005);}
  .leaflet-popup-content-wrapper{background:var(--panel); color:var(--paper); border-radius:6px; border:1px solid var(--line);}
  .leaflet-popup-tip{background:var(--panel);}
  .pop h3{margin:0 0 4px; font-size:14px;}
  .pop .row{font-size:12px; color:var(--paper-dim); margin-top:2px;}
  .pop .row b{color:var(--paper); font-weight:600;}
  .pin{width:24px; height:24px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; border:2px solid rgba(0,0,0,.35); box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .pin span{transform:rotate(45deg); font-family:var(--font-mono); font-size:9px; font-weight:700; color:#12161b;}
  .pin.MANHÃ{background:var(--manha);}
  .pin.TARDE{background:var(--tarde);}
  .pin.INDEFINIDO{background:#8a94a3;}
  .pin-origem{
    width:36px; height:36px; border-radius:50%;
    background:#1f2530; border:3px solid var(--tarde);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  .pin-motorista{
    width:34px; height:34px; border-radius:50%;
    background:#fff; border:3px solid var(--manha);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; box-shadow:0 3px 10px rgba(0,0,0,.4);
    animation:pulso-motorista 2s infinite;
  }
  @keyframes pulso-motorista{
    0%, 100%{box-shadow:0 3px 10px rgba(0,0,0,.4);}
    50%{box-shadow:0 3px 10px rgba(0,0,0,.4), 0 0 0 6px rgba(232,162,61,.25);}
  }
  .rotulo-cliente{background:#fff; color:#1f2430; border:1px solid rgba(0,0,0,.15); border-radius:5px; padding:2px 7px; font-size:10.5px; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.25); white-space:nowrap;}
  .rotulo-cliente::before{border-top-color:#fff;}
  .marker-cluster-manha{background:rgba(232,162,61,.5);} .marker-cluster-manha div{background:rgba(232,162,61,.85); color:#1a1305;}
  .marker-cluster-tarde{background:rgba(47,147,163,.5);} .marker-cluster-tarde div{background:rgba(47,147,163,.85); color:#04191c;}
  .marker-cluster-indefinido{background:rgba(138,148,163,.5);} .marker-cluster-indefinido div{background:rgba(138,148,163,.85); color:#12161b;}
  .marker-cluster-mix{background:rgba(238,241,244,.35);} .marker-cluster-mix div{background:rgba(238,241,244,.85); color:#12161b;}

  #config-banner{position:absolute; top:14px; left:14px; right:14px; z-index:1000; background:var(--fila); color:#fff; padding:10px 14px; border-radius:6px; font-size:12.5px; display:none;}

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  #tableView{display:none; height:100vh; overflow:auto; padding:20px; background:#ffffff; color:#1f2430;}
  .tabela-toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .tabela-toolbar .contagem{font-family:var(--font-mono); font-size:11px; color:#4b5563;}
  .tabela-controles{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .periodo-tabela{display:flex; border:1px solid #c7ccd3; border-radius:4px; overflow:hidden;}
  .periodo-tabela button{padding:5px 10px; border:none; background:#fff; color:#4b5563; font-size:10.5px; font-family:var(--font-mono); cursor:pointer; border-right:1px solid #c7ccd3;}
  .periodo-tabela button:last-child{border-right:none;}
  .periodo-tabela button.active{background:var(--manha); color:#1a1305; font-weight:700;}
  .data-tabela{display:flex; align-items:center; gap:5px;}
  .data-tabela input[type=date]{
    padding:5px 7px; border:1px solid #c7ccd3; border-radius:4px; color:#1f2430;
    font-size:10.5px; font-family:var(--font-mono); background:#fff;
  }
  .data-tabela span{font-size:10.5px; color:#6b7280;}
  .data-tabela .btn-limpar-data{
    padding:5px 8px; border:1px solid #c7ccd3; border-radius:4px; background:#fff;
    color:#6b7280; font-size:10.5px; font-family:var(--font-mono); cursor:pointer;
  }
  .legenda{display:flex; gap:12px; flex-wrap:wrap;}
  .legenda span{display:flex; align-items:center; gap:5px; font-size:10.5px; color:#374151;}
  .legenda i{display:inline-block; width:10px; height:10px; border-radius:2px; border:1px solid rgba(0,0,0,.25);}

  .tabela-entregas{width:100%; min-width:1050px; border-collapse:collapse; font-size:11px; background:#ffffff; border:1px solid #d5a6bd; table-layout:fixed;}
  .tabela-entregas.largura-percentual{min-width:0; width:100%;}
  .tabela-entregas th{
    text-align:left; padding:7px 8px; border:1px solid #d5a6bd; font-family:var(--font-mono); font-size:9px;
    letter-spacing:.06em; text-transform:uppercase; color:#1f2430; position:sticky; top:0; background:#f0f0f0;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .tabela-entregas td{padding:5px 6px; border:1px solid #d5a6bd; vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tabela-entregas.condensada th{padding:4px 6px; font-size:8px;}
  .tabela-entregas.condensada td{padding:0 4px; font-size:10px; line-height:1.5;}
  .tabela-entregas .td-cliente{font-weight:700; white-space:nowrap;}
  .tabela-entregas .td-data{font-weight:700;}
  .tabela-entregas .td-cidade{white-space:nowrap;}
  .tabela-entregas .td-centro{text-align:center;}
  .tabela-entregas .td-check{text-align:center; width:34px;}
  .th-ordenavel{cursor:pointer; user-select:none;}
  .th-ordenavel:hover{background:#e6e6e6;}
  .th-status{position:relative;}
  .th-status-linha{display:flex; align-items:center; gap:4px;}
  .th-filtro-btn{background:none; border:none; cursor:pointer; padding:0 2px; font-size:9px; color:#1f2430; line-height:1;}
  .th-filtro-popup{display:none; position:fixed; background:#fff; border:1px solid #000; border-radius:4px; padding:8px 10px; z-index:2000; box-shadow:0 4px 14px rgba(0,0,0,.3); min-width:140px;}
  .th-filtro-popup.aberto{display:block;}
  .col-resize-handle{
    position:absolute; top:0; right:-3px; width:7px; height:100%;
    cursor:col-resize; user-select:none; z-index:5; touch-action:none;
  }
  .col-resize-handle:hover, .col-resize-handle.resizando{background:rgba(47,147,163,.35);}
  .btn-toggle-tabela{
    padding:5px 10px; border:1px solid #c7ccd3; border-radius:4px; background:#fff; color:#4b5563;
    font-size:10.5px; font-family:var(--font-mono); cursor:pointer;
  }
  .btn-toggle-tabela.active{background:var(--tarde); color:#fff; border-color:var(--tarde); font-weight:700;}
  .th-filtro-popup label{display:flex; align-items:center; gap:6px; padding:4px 0; font-family:var(--font-ui); font-size:11.5px; text-transform:none; letter-spacing:normal; font-weight:400; color:#1f2430; white-space:nowrap; cursor:pointer;}
  .td-checkbox{width:16px; height:16px; accent-color:var(--manha); cursor:not-allowed;}
</style>
</head>
<body>
<div id="app">
  <button id="sidebarToggle" onclick="alternarSidebar()" title="Minimizar/maximizar painel">‹</button>
  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">Perfinorte · Expedição · <span id="ultimaAtualizacao"></span></div>
      <h1>Mapa de Entregas</h1>
      <span class="tag-somente-ver">👁 Somente visualização</span>
      <div class="view-toggle">
        <button id="btnVerMapa" class="active" onclick="mostrarView('mapa')">🗺 Mapa</button>
        <button id="btnVerTabela" onclick="mostrarView('tabela')">📋 Tabela</button>
      </div>
    </div>

    <div class="controls">
      <div class="field">
        <label>Data (previsão)</label>
        <div class="date-range">
          <input type="date" id="dataDeInput">
          <span class="date-range-sep">→</span>
          <input type="date" id="dataAteInput">
        </div>
        <div class="date-atalhos">
          <button type="button" onclick="definirDataAtalho_('hoje')">Hoje</button>
          <button type="button" onclick="definirDataAtalho_('amanha')">Amanhã</button>
        </div>
      </div>
      <div class="field">
        <label>Período</label>
        <div class="period-toggle" id="periodoToggle">
          <button data-p="" class="active">TODOS</button>
          <button data-p="MANHÃ">MANHÃ</button>
          <button data-p="TARDE">TARDE</button>
        </div>
      </div>
      <div class="field">
        <label for="motoristaSelect">Motorista</label>
        <select id="motoristaSelect"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label>Status <small style="text-transform:none; opacity:.6;">(só afeta o mapa)</small></label>
        <div class="status-filtro-sidebar" id="statusFiltroSidebar">
          <label><input type="checkbox" value="ENTREGUE" checked onchange="alternarStatusSidebar_(this)"> Entregue</label>
          <label><input type="checkbox" value="EM ANDAMENTO" checked onchange="alternarStatusSidebar_(this)"> Em andamento</label>
          <label><input type="checkbox" value="EM FILA" checked onchange="alternarStatusSidebar_(this)"> Em fila</label>
        </div>
      </div>
      <div class="field">
        <label>Pedido pronto <small style="text-transform:none; opacity:.6;">(só afeta o mapa)</small></label>
        <div class="period-toggle" id="okToggle">
          <button type="button" data-ok="" class="active" onclick="definirFiltroOk_('')">Todos</button>
          <button type="button" data-ok="sim" onclick="definirFiltroOk_('sim')">✓ Prontos</button>
          <button type="button" data-ok="nao" onclick="definirFiltroOk_('nao')">✗ Não prontos</button>
        </div>
      </div>
    </div>
  </aside>

  <main style="position:relative;">
    <div id="config-banner">Configure a URL da API no início do arquivo (constante <code>API_URL</code>).</div>
    <div id="map"></div>
    <div id="tableView"><div id="tabelaContainer"></div></div>
  </main>

  <button id="sidebarDireitoToggle" onclick="alternarSidebarDireito_()" title="Minimizar/maximizar lista">›</button>
  <aside id="sidebarDireito">
    <div class="summary">
      <div class="stat"><div class="n" id="statTotal">–</div><div class="l">Entregas</div></div>
      <div class="stat"><div class="n" id="statCidades">–</div><div class="l">Cidades</div></div>
      <div class="stat geo-warn"><div class="n" id="statSemGeo">–</div><div class="l">Sem endereço</div></div>
    </div>
    <div id="list"><div class="loading"><div class="big">⏳</div>Carregando entregas…</div></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* =====================================================================
 * COLE AQUI A MESMA URL DO /exec usada no Mapa.html.
 * ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxq2r5WwP_DxFUpO7jV7XthtIGbTLlie8Od799ehwYANEabahf5TitwIt9RqVhXyft6/exec";

let map, clusterManha, clusterTarde, clusterIndefinido, markersById = {};
let todasEntregas = [], entregasAtuais = [], entregasParaTabela = [];
let filtroPeriodo = "";
let modoAtual = 'mapa';
let motoristasDisponiveis = [];
let filtroStatusSidebar = new Set(['ENTREGUE','EM ANDAMENTO','EM FILA']);
let filtroOkSidebar = '';
let filtroStatusTabela = new Set(['ENTREGUE','EM ANDAMENTO','EM FILA','VAZIO']);
let filtroPeriodoTabela = '';
let filtroDataDeTabela = '';
let filtroDataAteTabela = '';
const TABELA_CONDENSADA_CHAVE = 'vendedoresTabelaCondensada';
const TABELA_PORCENTAGEM_CHAVE = 'vendedoresTabelaLarguraPorcentagem';
let tabelaCondensada = localStorage.getItem(TABELA_CONDENSADA_CHAVE) === '1';
let larguraEmPorcentagem = localStorage.getItem(TABELA_PORCENTAGEM_CHAVE) === '1';

function alternarCondensada_(){
  tabelaCondensada = !tabelaCondensada;
  try{ localStorage.setItem(TABELA_CONDENSADA_CHAVE, tabelaCondensada ? '1' : '0'); }catch(e){}
  renderTabela();
}
function alternarLarguraPorcentagem_(){
  larguraEmPorcentagem = !larguraEmPorcentagem;
  try{ localStorage.setItem(TABELA_PORCENTAGEM_CHAVE, larguraEmPorcentagem ? '1' : '0'); }catch(e){}
  renderTabela();
}

/* ----- larguras das colunas da tabela (arrastar pra redimensionar, igual Sheets) ----- */
const LARGURA_COLUNAS_CHAVE = 'vendedoresTabelaLarguraColunas';
let larguraColunas = {};
try{ larguraColunas = JSON.parse(localStorage.getItem(LARGURA_COLUNAS_CHAVE) || '{}'); }catch(e){ larguraColunas = {}; }

function estiloLarguraCol_(chave, padrao){
  const largura = larguraColunas[chave] || padrao;
  return largura ? ' style="width:' + largura + 'px;"' : '';
}
function handleResize_(chave){
  return '<span class="col-resize-handle" onmousedown="iniciarResizeColuna_(event,\'' + chave + '\')" ' +
    'ontouchstart="iniciarResizeColuna_(event,\'' + chave + '\')" onclick="event.stopPropagation()"></span>';
}
function iniciarResizeColuna_(e, chave){
  e.preventDefault();
  e.stopPropagation();
  const th = e.target.closest('th');
  const handle = e.target;
  handle.classList.add('resizando');

  const pontoInicial = (e.touches && e.touches[0]) ? e.touches[0] : e;
  const startX = pontoInicial.clientX;
  const startWidth = th.offsetWidth;

  function mover(ev){
    const ponto = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const novaLargura = Math.max(36, startWidth + (ponto.clientX - startX));
    th.style.width = novaLargura + 'px';
    larguraColunas[chave] = novaLargura;
  }
  function soltar(){
    handle.classList.remove('resizando');
    document.removeEventListener('mousemove', mover);
    document.removeEventListener('mouseup', soltar);
    document.removeEventListener('touchmove', mover);
    document.removeEventListener('touchend', soltar);
    try{ localStorage.setItem(LARGURA_COLUNAS_CHAVE, JSON.stringify(larguraColunas)); }catch(err){}
  }
  document.addEventListener('mousemove', mover);
  document.addEventListener('mouseup', soltar);
  document.addEventListener('touchmove', mover, { passive:false });
  document.addEventListener('touchend', soltar);
}

function initMap(){

  }).addTo(map);

  clusterTarde = L.markerClusterGroup({ iconCreateFunction: makeClusterIcon('tarde') });
  clusterIndefinido = L.markerClusterGroup({ iconCreateFunction: makeClusterIcon('indefinido') });
  map.addLayer(clusterManha);

function makeClusterIcon(kind){
  return function(cluster){
    const count = cluster.getChildCount();
    return L.divIcon({ html: `<div>${count}</div>`, className: 'marker-cluster marker-cluster-' + kind, iconSize: L.point(36,36) });
  };
}
function pinIcon(periodo){
  let cls, letra;
  if (periodo === 'TARDE'){ cls = 'TARDE'; letra = 'T'; }
  else if (periodo === 'MANHÃ'){ cls = 'MANHÃ'; letra = 'M'; }
  else { cls = 'INDEFINIDO'; letra = 'I'; }
  return L.divIcon({ className:'', html:`<div class="pin ${cls}"><span>${letra}</span></div>`, iconSize:[24,24], iconAnchor:[12,24], popupAnchor:[0,-22] });
}

function tempoRelativo_(isoTexto){
  if (!isoTexto) return '';
  const diffMs = Date.now() - new Date(isoTexto).getTime();
  const min = Math.round(diffMs / 60000);
  if (min < 1) return 'agora mesmo';
  if (min === 1) return 'há 1 min';
  if (min < 60) return 'há ' + min + ' min';
  const h = Math.round(min / 60);
  return 'há ' + h + (h === 1 ? ' hora' : ' horas');
}

let markersMotoristas = {};
async function carregarLocalizacoesMotoristas(){
  if (!API_URL) return;
  try{
    const lista = await chamarAPI_GET_({ formato: 'localizacoesMotoristas' });
    const agora = Date.now();
    const vistos = new Set();

    (Array.isArray(lista) ? lista : []).forEach(loc => {
      const idadeMin = (agora - new Date(loc.atualizadoEm).getTime()) / 60000;
      if (idadeMin > 20) return;

      vistos.add(loc.motorista);
      const popupHtml = '<div class="pop"><h3>🚚 ' + loc.motorista + '</h3>' +
        '<div class="row">Atualizado ' + tempoRelativo_(loc.atualizadoEm) + '</div></div>';

      if (markersMotoristas[loc.motorista]){
        markersMotoristas[loc.motorista].setLatLng([loc.lat, loc.lng]);
        markersMotoristas[loc.motorista].setPopupContent(popupHtml);
      } else {
        markersMotoristas[loc.motorista] = L.marker([loc.lat, loc.lng], { icon: motoristaIcon_() })
          .bindPopup(popupHtml)
          .addTo(map);
      }
    });

    Object.keys(markersMotoristas).forEach(nome => {
      if (!vistos.has(nome)){
        map.removeLayer(markersMotoristas[nome]);
        delete markersMotoristas[nome];
      }

}

function aplicarFiltros(ajustarZoom){
  if (ajustarZoom === undefined) ajustarZoom = true;
  const dataDe = document.getElementById('dataDeInput').value;
  const dataAte = document.getElementById('dataAteInput').value;
  const motorista = document.getElementById('motoristaSelect').value;

  entregasAtuais = todasEntregas.filter(d => {
    // sem data, não aparece no mapa (continua na tabela normalmente)
    if (!d.data) return false;
    if (dataDe && d.data < dataDe) return false;
    if (dataAte && d.data > dataAte) return false;
    if (filtroPeriodo && d.periodo !== filtroPeriodo) return false;
    if (motorista && String(d.motorista||'').toUpperCase() !== motorista.toUpperCase()) return false;
    const chaveStatus = String(d.status || '').trim().toUpperCase() || 'VAZIO';
    if (!filtroStatusSidebar.has(chaveStatus)) return false;
    if (filtroOkSidebar === 'sim' && d.ok !== true) return false;
    if (filtroOkSidebar === 'nao' && d.ok === true) return false;
    return true;
  });

  entregasParaTabela = todasEntregas;

  salvarPreferencias();
  if (modoAtual === 'tabela') renderTabela(ajustarZoom === false); else render(ajustarZoom);
}

function render(ajustarZoom){
  if (ajustarZoom === undefined) ajustarZoom = true;
  clusterManha.clearLayers();
  clusterTarde.clearLayers();
  clusterIndefinido.clearLayers();
  markersById = {};

  const list = document.getElementById('list');
  const cidades = new Set();
  let semGeo = 0;
  const bounds = [];

  if (!entregasAtuais.length){
    list.innerHTML = '<div class="empty"><div class="big">📭</div>Nenhuma entrega encontrada<br>para esses filtros.</div>';
  } else {
    list.innerHTML = entregasAtuais.map((d, i) => {
      const badgeClass = d.periodo === 'TARDE' ? 'TARDE' : 'MANHÃ';
      const semEndereco = (d.lat == null || d.lng == null);
      return `
        <div class="item" data-idx="${i}" onclick="focarEntrega(${i})">
          <div class="top">
            <span class="cliente">${d.cliente}</span>
            <span class="badge ${badgeClass}">${d.periodo || '—'}</span>
          </div>
          <div class="meta">${d.cidade || '—'}<span class="dot">·</span>${d.motorista || '—'}</div>
          <span class="status ${statusClass(d.status)}">${d.status || '—'}</span>
          ${semEndereco ? '' : ''}
        </div>`;
    }).join('');
  }

  entregasAtuais.forEach((d, i) => {
    if (d.cidade) cidades.add(d.cidade);
    if (d.lat == null || d.lng == null){ semGeo++; return; }
    const icone = pinIcon(d.periodo);
    const marker = L.marker([d.lat, d.lng], { icon: icone });
    marker.bindTooltip(escapeAttr_(d.cliente), { permanent: true, direction: 'top', offset: [0, -22], className: 'rotulo-cliente' });
    marker.bindPopup(`
      <div class="pop">
        <h3>${d.cliente}</h3>
        <div class="row"><b>Endereço:</b> ${d.endereco}</div>
        <div class="row"><b>Motorista:</b> ${d.motorista || '—'}</div>
        <div class="row"><b>Data:</b> ${formatarDataBR_(d.data) || '—'} · ${d.periodo || '—'}</div>
        ${d.observacoes ? `<div class="row"><b>Obs:</b> ${d.observacoes}</div>` : ''}
        <span class="status ${statusClass(d.status)}">${d.status || '—'}</span>
      </div>
    `);
    const clusterAlvo = d.periodo === 'TARDE' ? clusterTarde : (d.periodo === 'MANHÃ' ? clusterManha : clusterIndefinido);
    clusterAlvo.addLayer(marker);
    markersById[i] = marker;
    bounds.push([d.lat, d.lng]);
  });

  document.getElementById('statTotal').textContent = entregasAtuais.length;
  document.getElementById('statCidades').textContent = cidades.size;
  document.getElementById('statSemGeo').textContent = semGeo;

  if (ajustarZoom && bounds.length){
    map.fitBounds(bounds, { padding:[40,40], maxZoom:13 });
  }
}

function focarEntrega(i){
  const marker = markersById[i];
  if (!marker) return;
  const ll = marker.getLatLng();
  map.setView(ll, 15, { animate:true });
  const parent = clusterManha.getVisibleParent(marker) || clusterTarde.getVisibleParent(marker) || clusterIndefinido.getVisibleParent(marker);
  if (parent && parent !== marker){
    clusterManha.zoomToShowLayer(marker, () => marker.openPopup());
    clusterTarde.zoomToShowLayer(marker, () => marker.openPopup());
    clusterIndefinido.zoomToShowLayer(marker, () => marker.openPopup());
  } else {
    marker.openPopup();
  }
}

function prioridadeStatusBase_(status){
  const s = String(status || '').trim().toUpperCase();
  if (s === 'ENTREGUE') return 0;
  if (s === 'EM ANDAMENTO') return 1;
  if (s === 'EM FILA') return 2;
  if (!s) return 3;
  if (s === 'CANCELAR') return 4;
  return 5;
}

function corLinhaEntrega_(d){
  const status = String(d.status || '').trim().toUpperCase();
  const codigoVazio = !String(d.codigo || '').trim();
  const cor = function(chave, reserva){ return coresStatus[chave] || reserva; };
  if (status === 'ENTREGUE') return cor('ENTREGUE', '#d9ead3');
  if (codigoVazio) return cor('ATENCAO', '#ea9999');
  if (status === 'CANCELAR') return cor('CANCELAR', '#f4cccc');
  if (d.ok === true) return cor('OK', '#cfe2f3');
  // "Em andamento" não colore a linha inteira — só a célula de Status
  if (status === 'EM FILA') return cor('EM FILA', '#e0c3e8');
  return '';
}
function corTextoLinhaEntrega_(d){
  const status = String(d.status || '').trim().toUpperCase();
  const codigoVazio = !String(d.codigo || '').trim();
  if (status === 'ENTREGUE') return '#0c343d';
  if (codigoVazio) return '';
  if (d.ok === true) return '#1c4587';
  if (status === 'EM FILA') return '#4c1130';
  return '';
}
function corCelulaStatus_(d){
  const status = String(d.status || '').trim().toUpperCase();
  if (status === 'EM ANDAMENTO'){
    const fundo = coresStatus['EM ANDAMENTO'] || '#fff2cc';
    return ' style="background:' + fundo + ';color:#7f6000;"';
  }
  return '';
}

// Cor da célula de Período — fundo claro com a fonte numa cor escura da
// mesma família (mesmo padrão visual do "Em andamento"/"Pedido pronto").
function corCelulaPeriodo_(d){
  const periodo = String(d.periodo || '').trim().toUpperCase();
  if (periodo === 'MANHÃ') return ' style="background:#fff2cc;color:#7f6000;"';
  if (periodo === 'TARDE') return ' style="background:#cfe2f3;color:#1c4587;"';
  return '';
}

// Cor da célula de Motorista — cor fixa e consistente por nome (calculada
// a partir do texto), assim o mesmo motorista sempre aparece com a mesma
// cor, sem precisar cadastrar nada na mão.
function corCelulaMotorista_(d){
  const nome = String(d.motorista || '').trim().toUpperCase();
  if (!nome) return '';
  let hash = 0;
  for (let i = 0; i < nome.length; i++){
    hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  }
  const matiz = Math.abs(hash) % 360;
  return ' style="background:hsl(' + matiz + ',60%,88%);color:hsl(' + matiz + ',55%,26%);"';
}

function renderTabela(ehAtualizacaoAutomatica){
  const container = document.getElementById('tabelaContainer');
  if (ehAtualizacaoAutomatica && container && document.activeElement && container.contains(document.activeElement)) return;

  let lista = entregasParaTabela.filter(d => {
    const chave = String(d.status || '').trim().toUpperCase() || 'VAZIO';
    if (!filtroStatusTabela.has(chave)) return false;
    if (filtroPeriodoTabela && d.periodo !== filtroPeriodoTabela) return false;
    if (filtroDataDeTabela && d.data && d.data < filtroDataDeTabela) return false;
    if (filtroDataAteTabela && d.data && d.data > filtroDataAteTabela) return false;
    return true;
  });

  if (!lista.length){
    container.innerHTML = '<div class="empty"><div class="big">📭</div>Nenhuma entrega encontrada<br>pra esses filtros.</div>';
    return;
  }

  lista = lista.slice().sort((a, b) => {
    const pa = prioridadeStatusBase_(a.status);
    const pb = prioridadeStatusBase_(b.status);
    if (pa !== pb) return pa - pb;
    const da = a.data || '';
    const db = b.data || '';
    if (da !== db){
      if (!da) return 1;
      if (!db) return -1;
      return ordenacaoData === 'asc' ? da.localeCompare(db) : db.localeCompare(da);
    }
    return (b.ok === true ? 1 : 0) - (a.ok === true ? 1 : 0);
  });

  const setaData = ordenacaoData === 'asc' ? '▲' : '▼';
  const checkStatus = (valor) => filtroStatusTabela.has(valor) ? ' checked' : '';

  let html = '<div class="tabela-toolbar">' +
      '<span class="contagem">' + lista.length + ' de ' + entregasParaTabela.length + ' entrega(s)</span>' +
      '<div class="tabela-controles">' +
        '<div class="data-tabela">' +
          '<input type="date" id="tabelaDataDe" value="' + filtroDataDeTabela + '" onchange="definirDataTabela_()">' +
          '<span>→</span>' +
          '<input type="date" id="tabelaDataAte" value="' + filtroDataAteTabela + '" onchange="definirDataTabela_()">' +
          ((filtroDataDeTabela || filtroDataAteTabela) ? '<button type="button" class="btn-limpar-data" onclick="limparDataTabela_()">✕</button>' : '') +
        '</div>' +
        '<div class="periodo-tabela">' +
          '<button type="button" class="' + (filtroPeriodoTabela === '' ? 'active' : '') + '" onclick="definirPeriodoTabela_(\'\')">Todos</button>' +
          '<button type="button" class="' + (filtroPeriodoTabela === 'MANHÃ' ? 'active' : '') + '" onclick="definirPeriodoTabela_(\'MANHÃ\')">Manhã</button>' +
          '<button type="button" class="' + (filtroPeriodoTabela === 'TARDE' ? 'active' : '') + '" onclick="definirPeriodoTabela_(\'TARDE\')">Tarde</button>' +
        '</div>' +
        '<button type="button" class="btn-toggle-tabela' + (tabelaCondensada ? ' active' : '') + '" onclick="alternarCondensada_()">↕ Condensada</button>' +
        '<button type="button" class="btn-toggle-tabela' + (larguraEmPorcentagem ? ' active' : '') + '" onclick="alternarLarguraPorcentagem_()" title="' + (larguraEmPorcentagem ? 'Largura fixa: colunas mantêm o tamanho, a tabela rola de lado se não couber' : 'Ajustar à tela: encolhe as colunas proporcionalmente pra caber tudo sem rolar de lado') + '">' + (larguraEmPorcentagem ? '🔒 Largura fixa' : '↔ Ajustar à tela') + '</button>' +
      '</div>' +
      '<div class="legenda">' +
        '<span><i style="background:' + (coresStatus['ENTREGUE']||'#d9ead3') + '"></i>Entregue</span>' +
        '<span><i style="background:' + (coresStatus['OK']||'#cfe2f3') + '"></i>Pedido pronto</span>' +
        '<span><i style="background:' + (coresStatus['EM ANDAMENTO']||'#fff2cc') + '"></i>Em andamento</span>' +
        '<span><i style="background:' + (coresStatus['EM FILA']||'#e0c3e8') + '"></i>Em fila</span>' +
        '<span><i style="background:' + (coresStatus['ATENCAO']||'#ea9999') + '"></i>Atenção</span>' +
      '</div>' +
    '</div>' +
    '<table class="tabela-entregas' + (tabelaCondensada ? ' condensada' : '') + (larguraEmPorcentagem ? ' largura-percentual' : '') + '"><thead><tr>' +
    '<th' + estiloLarguraCol_('codigo', 70) + '>Código' + handleResize_('codigo') + '</th>' +
    '<th' + estiloLarguraCol_('cliente', 150) + '>Cliente' + handleResize_('cliente') + '</th>' +
    '<th' + estiloLarguraCol_('repr', 70) + '>Repr.' + handleResize_('repr') + '</th>' +
    '<th' + estiloLarguraCol_('endereco', 220) + '>Endereço' + handleResize_('endereco') + '</th>' +
    '<th' + estiloLarguraCol_('cidade', 110) + '>Cidade' + handleResize_('cidade') + '</th>' +
    '<th' + estiloLarguraCol_('motorista', 100) + '>Motorista' + handleResize_('motorista') + '</th>' +
    '<th class="th-ordenavel"' + estiloLarguraCol_('data', 100) + ' onclick="alternarOrdenacaoData_()">Data <span>' + setaData + '</span>' + handleResize_('data') + '</th>' +
    '<th' + estiloLarguraCol_('periodo', 80) + '>Período' + handleResize_('periodo') + '</th>' +
    '<th class="th-status"' + estiloLarguraCol_('status', 120) + '>' +
      '<span class="th-status-linha">Status' +
        '<button type="button" class="th-filtro-btn" onclick="alternarFiltroStatusPopup_(event)">▾</button>' +
      '</span>' +
      '<div class="th-filtro-popup' + (filtroPopupAberto ? ' aberto' : '') + '" id="filtroStatusPopup">' +
        '<label><input type="checkbox"' + checkStatus('ENTREGUE') + ' onchange="alternarStatusNoFiltro_(\'ENTREGUE\', this.checked)"> Entregue</label>' +
        '<label><input type="checkbox"' + checkStatus('EM ANDAMENTO') + ' onchange="alternarStatusNoFiltro_(\'EM ANDAMENTO\', this.checked)"> Em andamento</label>' +
        '<label><input type="checkbox"' + checkStatus('EM FILA') + ' onchange="alternarStatusNoFiltro_(\'EM FILA\', this.checked)"> Em fila</label>' +
        '<label><input type="checkbox"' + checkStatus('VAZIO') + ' onchange="alternarStatusNoFiltro_(\'VAZIO\', this.checked)"> — (vazio)</label>' +
      '</div>' +
      handleResize_('status') +
    '</th>' +
    '<th' + estiloLarguraCol_('obs', 170) + '>Observações' + handleResize_('obs') + '</th>' +
    '</tr></thead><tbody>';

  lista.forEach(d => {
    const corLinha = corLinhaEntrega_(d);
    const corTexto = corTextoLinhaEntrega_(d);
    const estiloLinha = (corLinha || corTexto)
      ? ' style="' + (corLinha ? 'background:' + corLinha + ';' : '') + (corTexto ? 'color:' + corTexto + ';' : '') + '"'
      : '';
    html += '<tr' + estiloLinha + '>' +
      '<td class="td-centro">' + escapeAttr_(d.codigo) + '</td>' +
      '<td class="td-cliente">' + d.cliente + '</td>' +
      '<td class="td-centro">' + escapeAttr_(d.representante) + '</td>' +
      '<td>' + escapeAttr_(d.endereco) + '</td>' +
      '<td class="td-cidade td-centro">' + (d.cidade || '—') + '</td>' +
      '<td class="td-centro"' + corCelulaMotorista_(d) + '>' + escapeAttr_(d.motorista) + '</td>' +
      '<td class="td-data td-centro">' + formatarDataBR_(d.data) + '</td>' +
      '<td class="td-centro"' + corCelulaPeriodo_(d) + '>' + (d.periodo || '—') + '</td>' +
      '<td class="td-centro"' + corCelulaStatus_(d) + '>' + (d.status || '—') + '</td>' +
      '<td>' + escapeAttr_(d.observacoes) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ===== INÍCIO =====
carregarPreferencias();
restaurarSidebar_();
restaurarSidebarDireito_();
initMap();
carregarEntregas();
carregarCoresStatus_();
carregarMarcadorPerfinorte_();
carregarLocalizacoesMotoristas();

const INTERVALO_ATUALIZACAO_MS = 10000;
setInterval(carregarEntregas, INTERVALO_ATUALIZACAO_MS);
setInterval(carregarLocalizacoesMotoristas, 15000);
</script>
</body>
</html>
